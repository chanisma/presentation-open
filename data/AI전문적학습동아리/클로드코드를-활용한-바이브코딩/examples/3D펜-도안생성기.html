<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D펜 꼬마 예술가를 위한 3D펜 컬러 도안 생성기</title>
    <!-- 구글 폰트: 단정하고 귀여운 고운 바탕(Gowun Batang) 및 나눔고딕 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-cute: #ff823a;
            --secondary-cute: #4a90e2;
            --mint-cute: #dcfd8b;
            --pink-cute: #ffb5b5;
            --bg-pastel: #fdfbf7;
            --text-dark: #333333;
        }

        * {
            box-sizing: border-box;
            font-family: 'Nanum Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-pastel);
            margin: 0;
            padding: 0;
            color: var(--text-dark);
            overflow-x: hidden;
            background-image: radial-gradient(#e6e1da 1px, transparent 1px);
            background-size: 24px 24px;
        }

        header {
            text-align: center;
            padding: 45px 20px 25px 20px;
            position: relative;
        }

        /* 세종학당체 고운바탕 서체 적용 및 깔끔 단정 디자인 */
        .main-title {
            font-family: 'Gowun Batang', serif;
            font-weight: 700;
            font-size: 42px;
            color: var(--text-dark);
            margin: 0 0 12px 0;
            display: inline-block;
            position: relative;
            line-height: 1.3;
            letter-spacing: -0.5px;
        }

        .main-title span {
            color: var(--secondary-cute);
            border-bottom: 4px solid var(--primary-cute);
            font-family: 'Gowun Batang', serif;
            font-weight: 700;
        }

        .sub-title {
            font-family: 'Gowun Batang', serif;
            font-size: 18px;
            color: #666;
            margin: 0;
            font-weight: bold;
        }

        .wrapper {
            max-width: 1000px;
            margin: 0 auto;
            padding: 10px 20px 40px 20px;
        }

        .card-panel {
            background: #ffffff;
            border: 3px solid var(--text-dark);
            border-radius: 28px;
            box-shadow: 8px 8px 0px var(--text-dark);
            padding: 35px;
            margin-bottom: 30px;
        }

        .dashboard-top {
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 850px) {
            .dashboard-top { grid-template-columns: 1fr; }
        }

        .control-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
        }

        .control-title {
            font-family: 'Gowun Batang', serif;
            font-weight: 700;
            font-size: 24px;
            margin: 0 0 5px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-dark);
        }

        .slider-wrapper {
            background: #fdf2e9;
            padding: 18px;
            border-radius: 18px;
            border: 2px solid var(--text-dark);
        }

        .slider-label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 12px;
            background: #ffe5d4;
            border-radius: 6px;
            outline: none;
            border: 2px solid var(--text-dark);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: var(--primary-cute);
            border: 2px solid var(--text-dark);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0px 2px 0px var(--text-dark);
        }

        .options-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .checkbox-wrapper, .radio-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: #f0f4f8;
            padding: 12px 15px;
            border-radius: 16px;
            border: 2px solid var(--text-dark);
            user-select: none;
            transition: background 0.2s;
        }
        
        .radio-wrapper:has(input:checked) { background: #e1f0ff; border-color: var(--secondary-cute); }

        .checkbox-wrapper input[type="checkbox"], .radio-wrapper input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: var(--secondary-cute);
            cursor: pointer;
        }

        .download-btn {
            background-color: #ffb5b5; 
            color: var(--text-dark);
            border: 2px solid var(--text-dark);
            font-family: 'Gowun Batang', serif;
            font-weight: 700;
            font-size: 22px;
            padding: 14px 20px;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--text-dark);
            transition: all 0.1s ease;
            margin-top: 10px;
        }

        .download-btn:hover:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--text-dark);
            background-color: #ff9999;
        }

        .download-btn:disabled {
            background-color: #eee; color: #bbb; cursor: not-allowed; box-shadow: none; border-color: #ccc;
        }

        .upload-box {
            border: 3px dashed var(--secondary-cute);
            background-color: #f6faff;
            border-radius: 24px;
            padding: 40px 25px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: all 0.2s;
        }

        .upload-box:hover { background-color: #eef5ff; transform: scale(1.01); }
        .upload-box input[type="file"] { display: none; }
        .upload-icon { font-size: 45px; margin: 0; }
        .upload-text { font-family: 'Gowun Batang', serif; font-size: 17px; font-weight: bold; color: #444; line-height: 1.5; }

        .canvas-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding-top: 10px;
        }

        .canvas-title {
            font-family: 'Gowun Batang', serif;
            font-weight: 700;
            font-size: 26px;
            color: var(--secondary-cute);
            margin: 0;
            background: #fff;
            padding: 0 20px;
        }

        .canvas-container {
            border: 3px solid var(--text-dark);
            border-radius: 20px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.06);
            max-width: 100%;
        }

        canvas { display: block; max-width: 100%; height: auto; }
    </style>
</head>
<body>

    <header>
        <h1 class="main-title">✏️ <span>꼬마 예술가</span>를 위한 3D펜 컬러 도안 생성기 🌈</h1>
        <p class="sub-title">세상에 단 하나뿐인 나만의 멋진 3D 작품을 단정하고 예쁘게 만들어봐요!</p>
    </header>

    <div class="wrapper">
        <div class="card-panel">
            <div class="dashboard-top">
                
                <div class="control-box">
                    <h2 class="control-title">📍 도안 설정하기</h2>
                    
                    <div class="slider-wrapper">
                        <div class="slider-label">
                            <span>검은 테두리 진하기</span>
                            <span id="threshold-val">40</span>
                        </div>
                        <input type="range" id="threshold" min="10" max="150" value="40">
                    </div>

                    <div class="options-group">
                        <label class="radio-wrapper">
                            <input type="radio" name="view-mode" id="mode-color" checked>
                            <span>🌈 컬러 모드</span>
                        </label>
                        <label class="radio-wrapper">
                            <input type="radio" name="view-mode" id="mode-mono">
                            <span>⚫ 흑백 모드</span>
                        </label>
                    </div>

                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="grid-toggle" checked>
                        <span>모눈종이 가이드 켜기</span>
                    </label>

                    <button class="download-btn" id="download-btn" disabled>🚀 도안 저장하기 🚀</button>
                </div>

                <label class="upload-box" id="drop-zone">
                    <p class="upload-icon">📸</p>
                    <p class="upload-text">도안으로 만들고 싶은 사진을<br><span style="color:var(--secondary-cute); font-size:19px;">여기에 넣어주세요!</span></p>
                    <input type="file" id="image-input" accept="image/*">
                </label>

            </div>

            <div class="canvas-area">
                <h3 class="canvas-title">✨ 완성과정 미리보기 ✨</h3>
                <div class="canvas-container">
                    <canvas id="result-canvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('image-input');
        const thresholdInput = document.getElementById('threshold');
        const thresholdVal = document.getElementById('threshold-val');
        const gridToggle = document.getElementById('grid-toggle');
        const modeColor = document.getElementById('mode-color');
        const modeMono = document.getElementById('mode-mono');
        const downloadBtn = document.getElementById('download-btn');
        const canvas = document.getElementById('result-canvas');
        const ctx = canvas.getContext('2d');
        
        let originalImage = null;

        canvas.width = 750;
        canvas.height = 400;
        drawPlaceholder();

        function drawPlaceholder() {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(200, 220, 240, 0.5)';
            ctx.lineWidth = 1;
            for (let x = 25; x < canvas.width; x += 25) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for (let y = 25; y < canvas.height; y += 25) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
            ctx.fillStyle = "#aaa";
            ctx.font = "bold 20px 'Gowun Batang'";
            ctx.textAlign = "center";
            ctx.fillText("꼬마 예술가님! 사진을 올려주시면 단정한 도안이 나타나요!", canvas.width / 2, canvas.height / 2);
        }

        imageInput.addEventListener('change', handleImage);
        thresholdInput.addEventListener('input', () => { thresholdVal.innerText = thresholdInput.value; processImage(); });
        gridToggle.addEventListener('change', processImage);
        modeColor.addEventListener('change', processImage);
        modeMono.addEventListener('change', processImage);

        function handleImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                originalImage = new Image();
                originalImage.onload = function() {
                    const maxW = 750;
                    const scale = originalImage.width > maxW ? maxW / originalImage.width : 1;
                    canvas.width = originalImage.width * scale;
                    canvas.height = originalImage.height * scale;
                    processImage();
                    downloadBtn.disabled = false;
                }
                originalImage.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        function processImage() {
            if (!originalImage) return;
            ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const width = imageData.width;
            const height = imageData.height;
            const gray = new Uint8ClampedArray(width * height);
            for (let i = 0; i < data.length; i += 4) { gray[i / 4] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]; }
            const output = ctx.createImageData(width, height);
            const outData = output.data;
            const isColorMode = modeColor.checked;
            for (let i = 0; i < outData.length; i += 4) {
                if (isColorMode) {
                    outData[i] = Math.min(255, data[i] + (255 - data[i]) * 0.7);
                    outData[i+1] = Math.min(255, data[i+1] + (255 - data[i+1]) * 0.7);
                    outData[i+2] = Math.min(255, data[i+2] + (255 - data[i+2]) * 0.7);
                } else { outData[i] = outData[i+1] = outData[i+2] = 255; }
                outData[i+3] = 255;
            }
            const threshold = parseInt(thresholdInput.value);
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const idx = (y * width + x);
                    const pixelX = (-1 * gray[idx - 1 - width] + 1 * gray[idx + 1 - width] + -2 * gray[idx - 1] + 2 * gray[idx + 1] + -1 * gray[idx - 1 + width] + 1 * gray[idx + 1 + width]);
                    const pixelY = (-1 * gray[idx - 1 - width] - 2 * gray[idx - width] - 1 * gray[idx + 1 - width] + 1 * gray[idx - 1 + width] + 2 * gray[idx + width] + 1 * gray[idx + 1 + width]);
                    const magnitude = Math.sqrt(pixelX * pixelX + pixelY * pixelY);
                    if (magnitude > threshold) {
                        const outIdx = idx * 4;
                        outData[outIdx] = outData[outIdx + 1] = outData[outIdx + 2] = 35;
                    }
                }
            }
            ctx.putImageData(output, 0, 0);
            if (gridToggle.checked) {
                ctx.strokeStyle = 'rgba(74, 144, 226, 0.35)';
                ctx.lineWidth = 1;
                const gridSize = 25;
                ctx.beginPath();
                for (let x = gridSize; x < width; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
                for (let y = gridSize; y < height; y += gridSize) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
                ctx.stroke();
            }
        }

        downloadBtn.addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'little-artist-color-stencil.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
