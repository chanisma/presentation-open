<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if(!location.pathname.endsWith('/')&&!location.pathname.endsWith('.html')){var b=document.createElement('base');b.href=location.pathname+'/';document.head.appendChild(b);}</script>
<title>히브리어로 보는 창세기 1장 — 창조 · 분리 · 승리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;
    --surface:#f7f7f7;
    --ink:#3c3c3c;
    --ink-soft:#777777;
    --ink-faint:#afafaf;
    --rule:#e5e5e5;
    --rule-deep:#d7d7d7;
    --accent:#58cc02;
    --accent-deep:#58a700;
    --accent-pale:#dbf8c5;
    --wash:#f7f7f7;
    --font-ui:'Nunito','Noto Sans KR',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* Top progress bar — chunky, Duolingo style */
  .progress{
    position:fixed;top:0;left:0;height:6px;width:0%;
    background:var(--accent);border-radius:0 9999px 9999px 0;
    transition:width .32s cubic-bezier(0.34,1.56,0.64,1);z-index:20;
  }

  .stage{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    padding:34px 60px 66px;
  }

  .slide-frame{
    position:relative;
    width:min(100%, calc((100vh - 100px) * 16 / 9));
    aspect-ratio:16/9;
    background:var(--paper);
    border:2px solid var(--rule);
    border-bottom:6px solid var(--rule-deep);
    border-radius:20px;
    overflow:hidden;
  }

  .slide{
    position:absolute;inset:0;
    opacity:0;transition:opacity .32s ease;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .slide.active{opacity:1;pointer-events:auto;}
  .slide img{
    width:100%;height:100%;
    object-fit:contain;
    display:block;
    user-select:none;-webkit-user-drag:none;
  }

  /* Footer ribbon */
  .ribbon{
    position:fixed;left:0;right:0;bottom:0;
    height:52px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;
    background:var(--paper);
    border-top:2px solid var(--rule);
    z-index:15;
  }
  .ribbon .meta{color:var(--ink-soft);font-size:14px;font-weight:600;}
  .ribbon .meta strong{color:var(--ink);font-weight:800;}
  .ribbon .counter{
    font-variant-numeric:tabular-nums;font-size:14px;font-weight:800;
    color:var(--accent-deep);background:var(--accent-pale);
    border-radius:9999px;padding:6px 16px;letter-spacing:.06em;
  }
  .ribbon .center{
    position:absolute;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:10px;
    font-size:12px;color:var(--ink-soft);font-weight:800;
    text-transform:uppercase;letter-spacing:0.16em;
  }
  .ribbon .dot{display:inline-block;width:8px;height:8px;border-radius:9999px;background:var(--accent);}
  .ribbon .dot.b{background:#ff9600;}
  .ribbon .dot.c{background:#ce82ff;}

  /* Side nav buttons — chunky */
  .nav-btn{
    position:fixed;top:50%;transform:translateY(-50%);
    width:48px;height:48px;
    background:var(--paper);
    border:2px solid var(--rule);border-bottom:4px solid var(--rule-deep);
    border-radius:14px;
    color:var(--ink-soft);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .18s ease, transform .12s ease, color .18s ease;
    z-index:18;
  }
  .nav-btn:hover{background:var(--accent-pale);color:var(--accent-deep);border-color:var(--accent);}
  .nav-btn:active{transform:translateY(calc(-50% + 3px));border-bottom-width:2px;}
  .nav-btn.prev{left:14px;}
  .nav-btn.next{right:14px;}
  .nav-btn svg{width:20px;height:20px;}
  .nav-btn:disabled{opacity:0.28;cursor:default;background:var(--paper);color:var(--ink-soft);border-color:var(--rule);}

  /* Index toggle + panel */
  .index-toggle{
    position:fixed;top:16px;right:16px;
    background:var(--accent);border:none;border-bottom:4px solid var(--accent-deep);
    border-radius:12px;color:#fff;
    padding:9px 18px;font:800 14px/1 var(--font-ui);
    letter-spacing:0.04em;cursor:pointer;z-index:18;
  }
  .index-toggle:active{transform:translateY(3px);border-bottom-width:1px;}
  .index-panel{
    position:fixed;inset:0;
    background:rgba(255,255,255,0.97);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    z-index:25;padding:48px;
  }
  .index-panel.open{display:flex;}
  .index-panel h2{font:900 30px var(--font-ui);margin-bottom:6px;color:var(--ink);}
  .index-panel .sub{
    font:800 12px var(--font-ui);letter-spacing:0.2em;text-transform:uppercase;
    color:#fff;background:var(--accent);border-radius:9999px;padding:6px 16px;margin-bottom:24px;
  }
  .index-grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));gap:16px;
    width:min(1100px,92%);max-height:70vh;overflow-y:auto;padding:8px 4px;
  }
  .thumb{
    position:relative;border:2px solid var(--rule);border-bottom:4px solid var(--rule-deep);
    border-radius:14px;aspect-ratio:16/9;background:var(--paper);cursor:pointer;overflow:hidden;
    transition:transform .15s ease,border-color .15s ease;
  }
  .thumb:hover{transform:translateY(-3px);border-color:var(--accent);border-bottom-color:var(--accent-deep);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .num{
    position:absolute;bottom:5px;right:6px;font:800 11px var(--font-ui);
    font-variant-numeric:tabular-nums;color:#fff;background:var(--accent);
    padding:2px 8px;border-radius:9999px;
  }
  .index-close{
    position:absolute;top:24px;right:24px;background:var(--paper);
    border:2px solid var(--rule);border-bottom:4px solid var(--rule-deep);border-radius:12px;
    cursor:pointer;font:800 13px var(--font-ui);color:var(--ink-soft);padding:8px 16px;
  }

  .corner-note{
    position:fixed;top:18px;left:24px;font:800 12px var(--font-ui);
    color:var(--ink-soft);letter-spacing:0.04em;z-index:18;
    display:flex;align-items:center;gap:10px;
  }
  .corner-note .unit{
    background:var(--surface);border:2px solid var(--rule);border-radius:9999px;
    padding:4px 12px;color:var(--ink-soft);
  }

  @media print{
    body{background:white;}
    .ribbon,.nav-btn,.index-toggle,.corner-note,.progress{display:none;}
    .stage{padding:0;}
    .slide-frame{border:none;border-radius:0;width:100%;height:100vh;}
  }

  @media (max-width: 720px){
    .stage{padding:14px 14px 58px;}
    .nav-btn{width:38px;height:38px;}
    .ribbon{height:46px;padding:0 14px;font-size:12px;}
    .ribbon .center{display:none;}
    .corner-note{display:none;}
  }
</style>
</head>
<body>

<div class="progress" id="progress"></div>

<aside class="corner-note">
  <span class="unit">UNIT 1</span>
  <span>히브리어로 보는 창세기 1장</span>
</aside>

<button class="index-toggle" id="indexToggle">목차</button>

<div class="stage">
  <div class="slide-frame" id="frame" aria-roledescription="presentation"></div>
</div>

<button class="nav-btn prev" id="prev" aria-label="이전 슬라이드">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
</button>
<button class="nav-btn next" id="next" aria-label="다음 슬라이드">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
</button>

<footer class="ribbon">
  <div class="meta"><strong>창조 · 분리 · 승리</strong> — 히브리어 단어 8개로 읽는 창세기 1장</div>
  <div class="center">
    <span class="dot"></span><span class="dot b"></span><span class="dot c"></span>
    <span>Duolingo · Session</span>
  </div>
  <div class="counter" id="counter">01 / 20</div>
</footer>

<div class="index-panel" id="indexPanel" role="dialog" aria-modal="true" aria-label="슬라이드 목차">
  <button class="index-close" id="indexClose">닫기</button>
  <h2>슬라이드 목차</h2>
  <div class="sub">창세기 1장 · 20 slides</div>
  <div class="index-grid" id="indexGrid"></div>
</div>

<script>
  const TOTAL = 20;
  const frame = document.getElementById('frame');
  const counter = document.getElementById('counter');
  const progress = document.getElementById('progress');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const indexToggle = document.getElementById('indexToggle');
  const indexPanel = document.getElementById('indexPanel');
  const indexClose = document.getElementById('indexClose');
  const indexGrid = document.getElementById('indexGrid');

  let current = 0;
  function pad(n){return String(n).padStart(2,'0');}

  for (let i = 1; i <= TOTAL; i++) {
    const num = pad(i);
    const div = document.createElement('div');
    div.className = 'slide' + (i === 1 ? ' active' : '');
    div.dataset.idx = i - 1;
    const img = document.createElement('img');
    img.src = 'images/slide-' + num + '.png';
    img.alt = '슬라이드 ' + i;
    img.loading = i <= 2 ? 'eager' : 'lazy';
    div.appendChild(img);
    frame.appendChild(div);
  }

  for (let i = 1; i <= TOTAL; i++) {
    const num = pad(i);
    const t = document.createElement('div');
    t.className = 'thumb';
    t.dataset.idx = i - 1;
    const tImg = document.createElement('img');
    tImg.src = 'images/slide-' + num + '.png';
    tImg.alt = '슬라이드 ' + i;
    tImg.loading = 'lazy';
    const n = document.createElement('span');
    n.className = 'num';
    n.textContent = num;
    t.appendChild(tImg);
    t.appendChild(n);
    indexGrid.appendChild(t);
  }

  const slides = Array.from(frame.querySelectorAll('.slide'));

  function show(idx){
    if (idx < 0) idx = 0;
    if (idx > TOTAL - 1) idx = TOTAL - 1;
    slides[current].classList.remove('active');
    slides[idx].classList.add('active');
    current = idx;
    counter.textContent = pad(current+1) + ' / ' + pad(TOTAL);
    progress.style.width = ((current+1)/TOTAL*100) + '%';
    prevBtn.disabled = (current === 0);
    nextBtn.disabled = (current === TOTAL - 1);
  }

  function next(){ show(current + 1); }
  function prev(){ show(current - 1); }

  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);

  document.addEventListener('keydown', (e) => {
    if (indexPanel.classList.contains('open')) {
      if (e.key === 'Escape') closeIndex();
      return;
    }
    if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft','PageUp','Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(TOTAL - 1);
    else if (e.key === 'Escape') closeIndex();
    else if (e.key === 'g' || e.key === 'G') openIndex();
  });

  let wheelLock = false;
  window.addEventListener('wheel', (e) => {
    if (wheelLock) return;
    if (Math.abs(e.deltaY) < 8) return;
    wheelLock = true;
    setTimeout(() => wheelLock = false, 420);
    if (e.deltaY > 0) next(); else prev();
  }, { passive: true });

  let tx = null, ty = null;
  window.addEventListener('touchstart', e => { const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
  window.addEventListener('touchend', e => {
    if (tx === null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { if (dx < 0) next(); else prev(); }
    tx = ty = null;
  }, { passive: true });

  frame.addEventListener('click', (e) => {
    const rect = frame.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x < rect.width / 3) prev(); else next();
  });

  function openIndex(){ indexPanel.classList.add('open'); }
  function closeIndex(){ indexPanel.classList.remove('open'); }
  indexToggle.addEventListener('click', openIndex);
  indexClose.addEventListener('click', closeIndex);
  indexGrid.addEventListener('click', (e) => {
    const t = e.target.closest('.thumb');
    if (!t) return;
    show(parseInt(t.dataset.idx, 10));
    closeIndex();
  });

  show(0);
</script>
</body>
</html>
