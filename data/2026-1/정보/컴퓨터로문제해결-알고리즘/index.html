<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>if(!location.pathname.endsWith('/')&&!location.pathname.endsWith('.html')){var b=document.createElement('base');b.href=location.pathname+'/';document.head.appendChild(b);}</script>
  <title>컴퓨터로 문제를 해결하는 능력 · 알고리즘</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+KR:wght@300;400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --paper-bg: #F5EFE2;
      --paper-deep: #EBE4D2;
      --ink: #2C2A26;
      --ink-soft: #5C594F;
      --ink-mute: #8A8579;
      --rule: #B8B0A0;
      --accent: #6B5B45;
      --highlight: #E8DCC0;
      --card-bg: #FBF7EC;
    }

    html, body {
      width: 100%; height: 100%;
      font-family: 'Noto Serif KR', serif;
      background: var(--paper-bg);
      color: var(--ink);
      overflow: hidden;
    }

    /* Subtle paper texture via gradient noise */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(circle at 20% 15%, rgba(184, 176, 160, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 85%, rgba(107, 91, 69, 0.06) 0%, transparent 45%);
      pointer-events: none;
    }

    .progress-bar {
      position: fixed; top: 0; left: 0; height: 3px;
      background: linear-gradient(90deg, var(--ink), var(--accent));
      transition: width 0.4s ease; z-index: 1000;
    }

    /* Slide container */
    .presentation {
      position: relative; z-index: 1;
      width: 100%;
      height: calc(100vh - 50px);
      display: flex; align-items: center; justify-content: center;
    }
    .slide {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
      padding: 1.5vh 2vw;
    }
    .slide.active { opacity: 1; pointer-events: auto; }

    /* === IMAGE SLIDE FRAME (1~11, 14) === */
    .slide-frame {
      max-width: 1400px;
      width: 100%;
      max-height: calc(100vh - 8vh);
      border-radius: 0.6rem;
      box-shadow: 0 16px 40px rgba(44, 42, 38, 0.10), 0 4px 10px rgba(44, 42, 38, 0.06);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: var(--card-bg);
    }
    .slide-frame img {
      width: 100%;
      height: auto;
      max-height: calc(100vh - 9vh);
      object-fit: contain;
      display: block;
    }

    /* === HAND-DRAWN CONTENT FRAME (12, 13) === */
    .paper-frame {
      max-width: 1400px;
      width: 100%;
      max-height: calc(100vh - 8vh);
      background: #FFFFFF;
      border-radius: 0.4rem;
      box-shadow: 0 16px 40px rgba(44, 42, 38, 0.10), 0 4px 10px rgba(44, 42, 38, 0.06);
      padding: 2.4rem 3rem;
      position: relative;
      overflow-y: auto;
      font-size: clamp(14px, 1.05vw, 22px);
    }
    /* Hand-drawn solid border (slightly wobbly, irregular ink stroke) */
    .paper-frame::before {
      content: '';
      position: absolute; inset: 1.1rem;
      border: 2px solid var(--ink);
      border-radius: 14px 10px 16px 8px / 8px 16px 10px 14px;
      pointer-events: none;
      box-shadow:
        inset 0 0 0 0.5px rgba(44, 42, 38, 0.35),
        0 0 0 0.5px rgba(44, 42, 38, 0.15);
      transform: rotate(-0.15deg);
    }
    .corner-dot {
      position: absolute;
      width: 8px; height: 8px;
      background: var(--ink); border-radius: 50%;
      pointer-events: none;
    }
    .corner-dot.tl { top: calc(1.1rem - 4px); left: calc(1.1rem - 4px); }
    .corner-dot.tr { top: calc(1.1rem - 4px); right: calc(1.1rem - 4px); }
    .corner-dot.bl { bottom: calc(1.1rem - 4px); left: calc(1.1rem - 4px); }
    .corner-dot.br { bottom: calc(1.1rem - 4px); right: calc(1.1rem - 4px); }

    .paper-content { position: relative; z-index: 1; padding: 0.4rem 0.6rem; }

    /* Simplified layout: title + centered image + link */
    .paper-simple {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .paper-img-center {
      max-width: 720px;
      width: 100%;
      margin: 0.4rem auto 0;
    }
    .paper-img-center img {
      max-height: 52vh;
      width: auto;
      max-width: 100%;
      margin: 0 auto;
    }
    .paper-link-row {
      display: flex;
      justify-content: center;
      margin-top: 0.4rem;
    }

    /* Headings */
    .paper-title {
      font-family: 'Cormorant Garamond', 'Noto Serif KR', serif;
      font-weight: 600;
      font-size: 2.2rem;
      color: var(--ink);
      letter-spacing: 0.02em;
      text-align: center;
      margin-bottom: 0.4rem;
    }
    .paper-title .ko { font-family: 'Noto Serif KR', serif; }

    .paper-rule {
      display: flex; align-items: center; justify-content: center; gap: 0.8rem;
      margin-bottom: 1.4rem;
    }
    .paper-rule::before, .paper-rule::after {
      content: ''; width: 60px; height: 1px; background: var(--ink);
    }
    .paper-rule .dot { width: 4px; height: 4px; background: var(--ink); border-radius: 50%; }

    /* Two-column layout */
    .paper-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.4rem;
      align-items: start;
      margin-top: 0.4rem;
    }
    .paper-col p { font-size: 1rem; line-height: 1.85; color: var(--ink); margin-bottom: 0.65rem; }
    .paper-col p .em { font-weight: 700; color: var(--ink); }

    /* Image inside paper */
    .paper-img-frame {
      border: 1.5px solid var(--rule);
      border-radius: 0.4rem;
      padding: 0.5rem;
      background: #FFFCF3;
    }
    .paper-img-frame img {
      width: 100%; height: auto; display: block;
      border-radius: 0.2rem;
    }
    .paper-img-caption {
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.92rem;
      color: var(--ink-soft);
      margin-top: 0.5rem;
    }

    /* Section subhead like "─── 활동 ───" */
    .paper-subhead {
      display: flex; align-items: center; justify-content: center; gap: 0.8rem;
      font-family: 'Cormorant Garamond', 'Noto Serif KR', serif;
      font-size: 1.1rem; font-weight: 600;
      color: var(--ink); margin: 0.7rem 0 0.5rem;
      letter-spacing: 0.04em;
    }
    .paper-subhead::before, .paper-subhead::after {
      content: ''; width: 36px; height: 1px; background: var(--ink-soft);
    }
    .paper-subhead.ko { font-family: 'Noto Serif KR', serif; font-weight: 500; }

    /* Numbered list (① ② ③) */
    .num-list { list-style: none; margin: 0.5rem 0; padding: 0; }
    .num-list li {
      display: flex; align-items: flex-start; gap: 0.8rem;
      padding: 0.45rem 0;
      font-size: 0.98rem; line-height: 1.7;
      color: var(--ink);
    }
    .num-circle {
      flex-shrink: 0;
      width: 1.7rem; height: 1.7rem; border-radius: 50%;
      border: 1.5px solid var(--ink);
      display: inline-flex; align-items: center; justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600; font-size: 0.95rem;
      color: var(--ink);
      margin-top: 0.05rem;
    }
    .num-list li strong { color: var(--ink); font-weight: 700; }

    /* Diamond bullet list */
    .diamond-list { list-style: none; margin: 0.5rem 0; padding: 0; }
    .diamond-list li {
      padding: 0.35rem 0 0.35rem 1.4rem;
      position: relative;
      font-size: 0.96rem; line-height: 1.75;
      color: var(--ink);
    }
    .diamond-list li::before {
      content: '◆';
      position: absolute; left: 0; top: 0.45rem;
      color: var(--accent);
      font-size: 0.7rem;
    }

    /* Code-like inline tag */
    .ink-code {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      background: var(--highlight);
      padding: 0.05rem 0.4rem;
      border-radius: 0.25rem;
      color: var(--ink);
      font-size: 0.95em;
    }

    /* Footnote / hint box */
    .paper-note {
      margin-top: 0.8rem;
      border-top: 1px dashed var(--rule);
      padding-top: 0.7rem;
      display: flex; align-items: flex-start; gap: 0.6rem;
      font-size: 0.9rem; color: var(--ink-soft);
      line-height: 1.7;
      font-style: italic;
    }
    .paper-note::before { content: '✎'; font-size: 1.1rem; color: var(--ink); flex-shrink: 0; }

    /* Link button (paper style) */
    .ink-btn {
      display: inline-flex; align-items: center; gap: 0.55rem;
      margin-top: 0.9rem;
      padding: 0.55rem 1.2rem;
      background: var(--ink);
      color: #FBF7EC !important;
      text-decoration: none;
      border-radius: 1.5rem;
      font-family: 'Cormorant Garamond', 'Noto Serif KR', serif;
      font-weight: 600;
      font-size: 0.92rem;
      letter-spacing: 0.04em;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(44, 42, 38, 0.18);
    }
    .ink-btn:hover { transform: translateY(-2px); box-shadow: 0 7px 14px rgba(44, 42, 38, 0.25); background: var(--accent); }
    .ink-btn svg { width: 0.8rem; height: 0.8rem; fill: currentColor; }
    .ink-btn .ink-host { font-style: italic; opacity: 0.78; font-size: 0.78rem; font-weight: 400; }

    /* Mini badges (서식 펜 박스) */
    .pen-tag {
      display: inline-block;
      border: 1px solid var(--ink-soft);
      padding: 0.18rem 0.7rem;
      border-radius: 0.3rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      color: var(--ink);
      margin-right: 0.3rem;
      margin-top: 0.4rem;
      background: #FFFCF3;
    }

    /* === NAV BAR === */
    .nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center;
      gap: 0.6rem; padding: 0.55rem 1.5rem;
      background: rgba(245, 239, 226, 0.92);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--rule);
      z-index: 999;
      height: 50px;
    }
    .nav-btn {
      display: flex; align-items: center; justify-content: center;
      width: 2rem; height: 2rem; border: 1px solid var(--rule);
      border-radius: 50%; background: var(--card-bg);
      cursor: pointer; color: var(--ink-soft); transition: all 0.2s;
    }
    .nav-btn svg { width: 0.7rem; height: 0.7rem; fill: currentColor; }
    .nav-btn:hover:not(:disabled) { border-color: var(--ink); background: var(--ink); color: var(--card-bg); }
    .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    .nav-counter {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px; font-weight: 600; color: var(--ink-soft);
      min-width: 3.5rem; text-align: center;
      display: flex; align-items: center; gap: 0.2rem;
    }
    .slide-input {
      width: 1.8rem; text-align: center; border: none; border-bottom: 1.5px solid transparent;
      background: transparent; font-size: 14px; font-weight: 600; color: inherit;
      outline: none; transition: border-color 0.2s; font-family: inherit;
    }
    .slide-input:focus { border-bottom-color: var(--ink); }

    @media (max-width: 900px) {
      .paper-cols { grid-template-columns: 1fr; gap: 1.2rem; }
      .paper-frame { padding: 1.6rem 1.4rem; }
      .paper-title { font-size: 1.7rem; }
    }
  </style>
</head>
<body>
  <div class="progress-bar" id="progressBar"></div>

  <div class="presentation" id="presentation">

    <!-- Slides 1~8 -->
    <div class="slide active" data-slide="0"><div class="slide-frame"><img src="slides/slide-01.jpg" alt="슬라이드 1 — 표지"></div></div>
    <div class="slide" data-slide="1"><div class="slide-frame"><img src="slides/slide-03.jpg" alt="슬라이드 2 — 알고리즘의 어원: 알 콰리즈미" loading="lazy"></div></div>
    <div class="slide" data-slide="2"><div class="slide-frame"><img src="slides/slide-02.jpg" alt="슬라이드 3 — 알고리즘이란 무엇인가" loading="lazy"></div></div>
    <div class="slide" data-slide="3"><div class="slide-frame"><img src="slides/slide-04.jpg" alt="슬라이드 4" loading="lazy"></div></div>
    <div class="slide" data-slide="4"><div class="slide-frame"><img src="slides/slide-05.jpg" alt="슬라이드 5" loading="lazy"></div></div>
    <div class="slide" data-slide="5"><div class="slide-frame"><img src="slides/slide-06.jpg" alt="슬라이드 6" loading="lazy"></div></div>
    <div class="slide" data-slide="6"><div class="slide-frame"><img src="slides/slide-07.jpg" alt="슬라이드 7" loading="lazy"></div></div>
    <div class="slide" data-slide="7"><div class="slide-frame"><img src="slides/slide-08.jpg" alt="슬라이드 8" loading="lazy"></div></div>

    <!-- ═══ SLIDE 9: 라이트봇 기본 사용법 ═══ -->
    <div class="slide" data-slide="8">
      <div class="paper-frame">
        <div class="paper-content paper-simple">
          <h1 class="paper-title">Lightbot <span class="ko">— 기본 사용법</span></h1>
          <div class="paper-rule"><span class="dot"></span></div>

          <div class="paper-img-frame paper-img-center">
            <img src="assets/lightbot_main.png" alt="라이트봇 메인 메소드 패널" loading="lazy" referrerpolicy="no-referrer">
          </div>

          <div class="paper-link-row">
            <a class="ink-btn" href="https://shaunwegs.github.io/lightbot/lightbot1.html" target="_blank" rel="noopener noreferrer">

              <span>Lightbot 플레이하러 가기</span>

    <!-- ═══ SLIDE 10: 라이트봇 함수(F1, F2) ═══ -->
    <div class="slide" data-slide="9">
      <div class="paper-frame">
        <div class="paper-content paper-simple">
          <h1 class="paper-title">Lightbot <span class="ko">— 함수(F1, F2)로 줄이기</span></h1>
          <div class="paper-rule"><span class="dot"></span></div>

          <div class="paper-img-frame paper-img-center">
            <img src="assets/lightbot_func_panel.png" alt="라이트봇 F1 F2 함수 패널" loading="lazy" referrerpolicy="no-referrer">
          </div>

          <div class="paper-link-row">
            <a class="ink-btn" href="https://shaunwegs.github.io/lightbot/lightbot1.html" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7zM5 5h6V3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-6h-2v6H5V5z"/></svg>
              <span>Lightbot 플레이하러 가기</span>
              <span class="ink-host">shaunwegs.github.io/lightbot/lightbot1.html</span>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Slides 11~13: 기존 slide-09, slide-10, slide-11 -->
    <div class="slide" data-slide="10"><div class="slide-frame"><img src="slides/slide-09.jpg" alt="슬라이드 11" loading="lazy"></div></div>
    <div class="slide" data-slide="11"><div class="slide-frame"><img src="slides/slide-10.jpg" alt="슬라이드 12" loading="lazy"></div></div>
    <div class="slide" data-slide="12"><div class="slide-frame"><img src="slides/slide-11.jpg" alt="슬라이드 13 — Lightbot에서 프로시저와 반복 체험하기" loading="lazy"></div></div>

  </div>

  <!-- ─── NAV BAR ─── -->
  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn" aria-label="이전 슬라이드">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </button>
    <div class="nav-counter">
      <input type="text" id="slideInput" class="slide-input" value="1" inputmode="numeric">
      <span>/</span>
      <span id="totalSlides">14</span>
    </div>
    <button class="nav-btn" id="nextBtn" aria-label="다음 슬라이드">
      <svg viewBox="0 0 24 24"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
    </button>
  </div>

  <script>
  (function() {
    var slides = document.querySelectorAll('.slide');
    var totalSlides = slides.length;
    var currentSlide = 0;
    var progressBar = document.getElementById('progressBar');
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    var slideInput = document.getElementById('slideInput');
    var totalSlidesEl = document.getElementById('totalSlides');

    totalSlidesEl.textContent = totalSlides;

    function goToSlide(idx) {
      if (idx < 0 || idx >= totalSlides) return;
      slides[currentSlide].classList.remove('active');
      currentSlide = idx;
      slides[currentSlide].classList.add('active');
      progressBar.style.width = ((currentSlide + 1) / totalSlides * 100) + '%';
      slideInput.value = currentSlide + 1;
      prevBtn.disabled = currentSlide === 0;
      nextBtn.disabled = currentSlide === totalSlides - 1;
    }
    window.goToSlide = goToSlide;

    prevBtn.addEventListener('click', function() { goToSlide(currentSlide - 1); });
    nextBtn.addEventListener('click', function() { goToSlide(currentSlide + 1); });

    slideInput.addEventListener('change', function() {
      var n = parseInt(slideInput.value, 10);
      if (!isNaN(n) && n >= 1 && n <= totalSlides) goToSlide(n - 1);
      else slideInput.value = currentSlide + 1;
    });
    slideInput.addEventListener('focus', function() { slideInput.select(); });

    document.addEventListener('keydown', function(e) {
      if (document.activeElement === slideInput) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        e.preventDefault(); goToSlide(currentSlide + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault(); goToSlide(currentSlide - 1);
      } else if (e.key === 'Home') {
        e.preventDefault(); goToSlide(0);
      } else if (e.key === 'End') {
        e.preventDefault(); goToSlide(totalSlides - 1);
      }
    });

    var wheelLock = false;
    document.addEventListener('wheel', function(e) {
      if (wheelLock) return;
      wheelLock = true;
      setTimeout(function() { wheelLock = false; }, 600);
      if (e.deltaY > 0) goToSlide(currentSlide + 1);
      else if (e.deltaY < 0) goToSlide(currentSlide - 1);
    }, { passive: true });

    var touchStartX = 0;
    document.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    document.addEventListener('touchend', function(e) {
      var diff = touchStartX - e.changedTouches[0].screenX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) goToSlide(currentSlide + 1);
        else goToSlide(currentSlide - 1);
      }
    }, { passive: true });

    goToSlide(0);
  })();
  </script>

  <script type="module" src="../../../../live/runtime/chrome.js?v=2"></script>
</body>
