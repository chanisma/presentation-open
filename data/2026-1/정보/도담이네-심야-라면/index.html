<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1530">
<title>도담이네 심야 라면 — 프로그램으로 라면 끓이기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#f7ecd6;--muted:#a9b0cc;--line:#3b4478;--paper:#1c2547;--cell:#141b38;--accent:#ffb648;--ok:#46c98a;--bad:#ff7a66;
 --c-act:#e4573d;--c-time:#5ab6e0;--c-move:#a58cf0;--c-if:#46c98a;--c-loop:#ffcf5c;--c-else:#d8b64a;--c-f1:#3fc9b8;--c-f2:#ff8fb1}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f1530;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif}
button,select{font:inherit;color:var(--ink)}
select{background:#26305c;border:1px solid var(--line);border-radius:7px;min-height:32px}
button{cursor:pointer;border:1px solid var(--line);background:#26305c;border-radius:7px;min-height:32px;padding:3px 11px;font-size:13px;font-weight:700;white-space:nowrap}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button[aria-pressed="true"]{background:var(--ink);color:#141b38;border-color:var(--ink)}
#artboard{position:absolute;left:50%;top:50%;width:1672px;height:941px;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center}
#stage{position:absolute;left:8px;top:8px;width:1168px;height:779px;display:block;overflow:hidden;background:#141b38;border-radius:9px}
.right{position:absolute;left:1186px;right:8px;top:8px;bottom:8px;display:flex;flex-direction:column;gap:7px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.t b{color:var(--ink)}
.levels{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.levels button{width:36px;padding:0;position:relative;min-height:34px}
.levels button.cur{background:var(--accent);border-color:var(--accent);color:#1c1a10}
.levels .st{position:absolute;left:0;right:0;bottom:0;font-size:8px;line-height:9px;color:var(--accent)}
.levels button.cur .st{color:#5b3b00}
.levels h1{margin:0 auto 0 0;font-size:19px;font-weight:900;white-space:nowrap}
#m-title{font-size:16px;font-weight:900;margin:2px 0 0;word-break:keep-all}
#m-text{margin:3px 0 0;font-size:12.5px;line-height:1.5;word-break:keep-all}
.palette{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.brk{flex-basis:100%;height:0}
.blk{width:52px;height:48px;flex:none;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0;background:color-mix(in srgb,var(--c) 18%,#1c2547);border:1.5px solid var(--c);touch-action:none;user-select:none;cursor:grab;font-size:9.5px;font-weight:700;line-height:1.1;min-height:0;white-space:normal;text-align:center;word-break:keep-all;color:var(--ink)}
.blk:hover{background:color-mix(in srgb,var(--c) 36%,#1c2547)}
.blk img{width:40px;height:25px;object-fit:contain;display:block;pointer-events:none}
.blk span{pointer-events:none}
.blk.fn{font-size:16px;font-weight:900}
.blk.flow{border-radius:15px 7px 15px 7px;border-width:3px;border-style:double}
.blk.current{box-shadow:0 0 0 3px var(--accent);transform:translateY(-1px)}
.blk.caller{box-shadow:0 0 0 2px rgba(255,182,72,.4)}
.blk.yes{box-shadow:0 0 0 3px var(--ok)!important}
.blk.no{box-shadow:0 0 0 3px var(--bad)!important}
.slots{display:grid;grid-template-columns:repeat(8,52px);gap:4px;margin-top:4px}
.cell{position:relative;width:52px;height:48px;border-radius:8px;background:var(--cell);border:1px dashed var(--line)}
.cell.drop{border-color:var(--accent);background:#4a3a1c}
.cell .blk{margin:-1px}
.cell[data-role]::after{content:attr(data-role);position:absolute;left:-3px;top:-6px;padding:0 4px;border-radius:5px;font-size:9px;line-height:13px;font-weight:900;color:#10183c;background:var(--ok);pointer-events:none}
.cell[data-role="거짓"]::after{background:var(--bad)}
.cell[data-role="반복"]::after{background:var(--c-loop)}
.panel{cursor:pointer}
.panel.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.panel.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.code-card{flex:1;min-height:0;display:flex;flex-direction:column}
#code{flex:1;min-height:0;overflow:auto;margin-top:4px;font:12px/1.4 Consolas,'D2Coding','Noto Sans KR',monospace;white-space:pre}
#code .ln{display:block;padding:0 4px;border-radius:3px}
#code .head{color:var(--c-f1);font-weight:700}
#code .current{background:var(--accent);color:#1c1a10;font-weight:700}
#code .caller{background:rgba(255,182,72,.2)}
.transport{position:absolute;left:8px;width:1168px;top:795px;bottom:8px;padding:9px 12px}
.tb{display:flex;gap:6px;align-items:center}
.tb .sp{flex:1}
#run{min-width:116px;background:var(--accent);border-color:var(--accent);color:#1c1a10;font-weight:900;height:34px}
#tl{display:block;width:100%;height:32px;margin-top:8px}
#range{display:block;width:100%;margin:6px 0 0;accent-color:var(--accent);height:16px}
.days{display:flex;gap:4px;margin-left:8px}
.days button.ok{border-color:var(--ok);color:var(--ok)}
#banner{position:absolute;left:206px;width:764px;bottom:170px;padding:12px 16px;border-radius:12px;background:var(--paper);border:2px solid var(--line);display:none;box-shadow:0 8px 28px rgba(0,0,0,.45)}
#banner.show{display:block}
#rules{position:absolute;left:150px;top:60px;width:876px;padding:16px 20px;border-radius:12px;background:var(--paper);border:2px solid var(--accent);box-shadow:0 8px 28px rgba(0,0,0,.5);z-index:20}
#rules[hidden]{display:none}
#rules h2{margin:0 0 8px;font-size:20px;font-weight:900}
#rules h3{margin:12px 0 5px;font-size:15px;font-weight:900;color:var(--accent)}
#rules p,#rules li{font-size:13.5px;line-height:1.6;word-break:keep-all;margin:0}
#rules ul{margin:0;padding-left:18px}
#rules table{border-collapse:collapse;width:100%;font-size:13.5px}
#rules td{padding:4px 8px;border-bottom:1px solid var(--line)}
#rules td.won{text-align:right;font-weight:800;white-space:nowrap}
#rules .cols{display:grid;grid-template-columns:1.15fr 1fr;gap:18px}
#rules .row{display:flex;justify-content:flex-end;margin-top:10px}
#b-rules{margin-top:7px}
#banner.win{border-color:var(--accent)}
#banner h2{margin:0;font-size:20px;font-weight:900;word-break:keep-all}
#banner .stars{color:var(--accent);margin-left:7px;letter-spacing:2px}
#banner p{margin:5px 0 0;font-size:13.5px;line-height:1.6;word-break:keep-all}
#banner .row{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
#banner .primary{background:var(--accent);border-color:var(--accent);color:#1c1a10}
#ghost{position:fixed;z-index:20;pointer-events:none;transform:translate(-50%,-50%);display:none}
.credit{font-size:10px;line-height:1.35;color:var(--muted);word-break:keep-all}
#stat{font-size:12px;font-weight:700;white-space:nowrap}
#loading{position:absolute;inset:0;background:#0f1530;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;z-index:9}
#loading[hidden]{display:none}
</style>
</head>
<body data-deck-title="도담이네 심야 라면" data-subject="정보">
<div id="artboard">
  <svg id="stage" viewBox="0 0 1536 1024" aria-label="도담이네 포장마차입니다. 프로그램이 실행되면 냄비에 재료가 들어갑니다."></svg>
  <section class="card transport">
    <div class="tb">
      <button id="run">▶ 실행</button><button id="step">한 칸 ▷</button><button id="back">◁ 한 칸</button><button id="rew">⏮ 처음으로</button>
      <div class="days" id="days"></div><span class="sp"></span><span id="stat"></span>
      <select id="speed" aria-label="실행 속도"><option value="0.8">천천히</option><option value="0.4" selected>보통</option><option value="0.14">빠르게</option></select>
      <button id="clear">🗑 모두 지우기</button>
    </div>
    <svg id="tl" viewBox="0 0 1130 24" preserveAspectRatio="none" aria-hidden="true"></svg>
    <input type="range" id="range" min="0" max="1000" value="0" aria-label="실행 되감기">
  </section>
  <div id="banner" role="status"></div>
  <div id="rules" role="dialog" aria-label="가격표와 규칙" hidden></div>
  <aside class="right">
    <section class="card"><div class="levels" id="levels"></div></section>
    <section class="card"><div class="t"><span id="m-no"></span><span id="m-par"></span></div><div id="m-title"></div><p id="m-text"></p><button id="b-rules" type="button">가격표와 규칙 보기</button></section>
    <section class="card"><div class="t">도담이가 할 수 있는 일 <span>눌러서 넣기 · 끌어서 끼우기</span></div><div class="palette" id="palette"></div></section>
    <div id="panels" style="display:flex;flex-direction:column;gap:7px"></div>
    <section class="card code-card"><div class="t">코드로 읽으면 <span>Python 모양</span></div><div id="code"></div></section>
    <div class="credit">끓는 시간과 값을 매기는 규칙은 플래시 게임 「슈의 라면집」(아이부라보)에서 착안했습니다. 그림, 인물, 문제는 모두 새로 만들었습니다.</div>
  </aside>
</div>
<div id="ghost"></div>
<div id="loading">포장마차 문을 여는 중…</div>
<script src="../game-record.js" data-game="ramen" data-total="6"></script>
<script type="module">
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,u)=>a+(b-a)*u;
const smooth=u=>u*u*(3-2*u);

// ───────── 규칙: 프레임 기준값과 값 매기기는 플래시 게임 「슈의 라면집」의 수치를 따랐다(12fps) ─────────
const FPS=12,BOIL=65,DONE=80,BURN=130;
const ACT=FPS;   // 도담이의 행동 하나는 1초(12프레임)가 걸린다. 이것은 프로그램 방식을 위해 새로 정한 값이다
function scoreOf(p,f){      // → {won, talk(대사 번호), cut(버림)}
  if(!p.water||!p.noodle||!p.soup)return{won:0,talk:1,cut:true,why:'물·라면·스프 중 빠진 것이 있습니다'};
  // 원본은 덜 익어도 300원(계란이 있으면 500원)을 줬다. 덜 익은 라면을 바로 내놓는 짧은 풀이가 기준보다 블록을 덜 써서 0원으로 바꿨다
  if(f<DONE)return{won:0,talk:p.egg?3:2,cut:true,why:'덜 익었습니다'};
  if(f>=BURN)return{won:0,talk:10,cut:true,burned:true,why:'냄비가 탔습니다'};
  const pa=p.pa,egg=p.egg,pb=p.paBoil,eb=p.eggBoil;
  // 값은 2026-11-04에 바꿨다(원본은 400·500·600·800·1000). 그릇당 손 동작이 4·5·6번이라, 70초 동안 안 넣은 라면(냄비 3개)·하나만 넣은 라면·다 넣은 라면(냄비 2개)의 수입이 비슷해지게 맞췄다
  if(pa&&egg){if(pb&&eb)return{won:1000,talk:7};if(pb||eb)return{won:900,talk:5};return{won:800,talk:6};}
  if(pa||egg){const b=pa?pb:eb;return{won:b?850:750,talk:b?4:6};}
  return{won:700,talk:4};
}

// ───────── 명령 ─────────
const CMD={
 W:{label:'물 붓기',code:'물_붓기()',c:'--c-time',sprite:'kettle'},
 N:{label:'라면',code:'라면_넣기()',c:'--c-act',sprite:'noodle'},
 S:{label:'스프',code:'스프_넣기()',c:'--c-act',sprite:'soup'},
 P:{label:'파',code:'파_넣기()',c:'--c-act',sprite:'scallion'},
 G:{label:'계란',code:'계란_넣기()',c:'--c-act',sprite:'egg'},
 V:{label:'내놓기',code:'내놓기()',c:'--c-act',sprite:'bowl'},
 T:{label:'1초 기다리기',code:'기다리기()',c:'--c-time',glyph:'⏱'},
 X:{label:'다음 냄비',code:'다음_냄비()',c:'--c-move',glyph:'➡'},
 R2:{label:'2번 반복',code:'for i in range(2):',c:'--c-loop',flow:'rep',n:2},
 R3:{label:'3번 반복',code:'for i in range(3):',c:'--c-loop',flow:'rep',n:3},
 R4:{label:'4번 반복',code:'for i in range(4):',c:'--c-loop',flow:'rep',n:4},
 UB:{label:'끓을 때까지',code:'while not 끓었나():',c:'--c-loop',flow:'until',q:'B'},
 UD:{label:'익을 때까지',code:'while not 익었나():',c:'--c-loop',flow:'until',q:'D'},
 IB:{label:'끓었나?',code:'끓었나()',c:'--c-if',flow:'if',q:'B'},
 ID:{label:'익었나?',code:'익었나()',c:'--c-if',flow:'if',q:'D'},
 IG:{label:'계란 주문?',code:'계란_주문()',c:'--c-if',flow:'if',q:'G'},
 IP:{label:'파 주문?',code:'파_주문()',c:'--c-if',flow:'if',q:'P'},
 E:{label:'아니면',code:'else',c:'--c-else',flow:'else'},
 1:{label:'F1',code:'F1()',c:'--c-f1',fn:'F1'},
 2:{label:'F2',code:'F2()',c:'--c-f2',fn:'F2'},
};
const QNAME={B:'끓었나',D:'익었나',G:'계란 주문인가',P:'파 주문인가'};
const PANELS=['main','F1','F2'],PNAME={main:'프로그램',F1:'F1',F2:'F2'};
const BASE=['W','N','S','P','G','V','T'];

// ───────── 문제 ─────────
const egg={egg:true},pa={pa:true},both={egg:true,pa:true};
// hidden: true인 문제는 지우지 않고 목록에서만 뺀다. 번호·저장·기록은 보이는 문제 기준이다
const ALL_LEVELS=[
{name:'첫 라면',pots:1,limit:30,slots:[12,8,8],use:[],days:[{target:700}],sol:{main:'W N S T T T T T V'},
 text:'물을 붓고 라면과 스프를 넣은 뒤, 익을 때까지 기다렸다가 내놓습니다. 도담이는 적힌 순서대로만 움직입니다. 물을 부은 뒤 80프레임(약 6.7초)이 지나야 라면이 익고, 덜 익은 라면은 돈을 받지 못합니다.',
 after:'적힌 순서대로 한 줄씩 실행했습니다. 이것이 순차 구조입니다.'},
{name:'언제 넣느냐',pots:1,limit:30,slots:[12,8,8],use:[],days:[{target:1000}],sol:{main:'W N S T T T T P G V'},
 text:'파와 계란은 물이 끓은 뒤(65프레임, 약 5.4초)에 넣어야 맛있고, 그래야 1,000원을 받습니다. 같은 명령이라도 순서와 시점에 따라 결과가 달라집니다.',
 after:'같은 재료를 넣어도 시점이 다르면 값이 달랐습니다. 프로그램은 무엇을 하느냐뿐 아니라 언제 하느냐도 정합니다.'},
{name:'세지 않고 기다리기',pots:1,limit:30,slots:[12,8,8],use:['UB'],days:[{target:1000}],sol:{main:'W N S UB T P G V'},
 text:'[끓을 때까지] 다음에 대기 블록을 하나 놓으면, 대기 블록을 세어서 쌓지 않아도 끓을 때까지 되풀이합니다.',
 after:'횟수를 세지 않고 조건이 될 때까지 되풀이했습니다. 이것이 while 반복입니다.'},
{name:'손님마다 다른 주문',hidden:true,pots:1,limit:30,slots:[12,8,8],use:['UB','IG','IP','E'],days:[{target:850,order:[egg]},{target:850,order:[pa]},{target:1000,order:[both]}],sol:{main:'W N S UB T IP P IG G V'},
 text:'영업일마다 손님의 주문이 다릅니다. 주문에 없는 재료를 넣으면 돈을 받지 못합니다. 프로그램 하나로 사흘을 모두 통과해야 하니, 주문을 확인해서 넣으세요.',
 after:'같은 프로그램이 주문에 따라 다르게 움직였습니다. 실행 중에 상황을 보고 고르는 것이 분기입니다.'},
{name:'한 냄비로 두 그릇',pots:1,limit:40,slots:[12,8,8],use:['UB','R2'],days:[{target:2000}],sol:{main:'R2 1',F1:'W N S UB T P G V'},
 text:'주문이 두 그릇으로 늘었지만 냄비는 아직 하나입니다. 한 그릇을 끓여 내놓은 뒤 같은 냄비로 다음 그릇을 끓입니다. 한 그릇 끓이는 절차를 함수로 묶고 두 번 불러 보세요.',
 after:'같은 절차에 이름을 붙이고 횟수만큼 불렀습니다. 그런데 [끓을 때까지]가 반복 안에 있어서, 그릇마다 손을 놓고 기다렸습니다. 기다린 시간을 기억해 두세요.'},
{name:'손은 하나, 냄비는 둘',pots:2,limit:14,slots:[12,8,8],use:['UB','R2','X'],days:[{target:2000}],compare:'한 냄비로 두 그릇',sol:{main:'R2 1 UB T R2 2',F1:'W N S X',F2:'P G V X'},
 text:'4번과 같은 두 그릇을 이번에는 냄비 두 개로 14초 안에 내야 합니다. 4번처럼 한 그릇을 다 끓이고 다음 그릇을 시작하면 시간이 모자랍니다. 물이 끓는 동안 도담이의 손은 비어 있다는 점을 이용해 보세요.',

// ───────── 인터프리터: 화면의 모든 것은 이 기록에서 나온다 ─────────
function stmtEnd(list,i){
  if(i>=list.length)return i;const c=CMD[list[i]];
  if(c.flow==='if'){let j=stmtEnd(list,i+1);if(list[j]==='E')j=stmtEnd(list,j+1);return j;}
  if(c.flow==='rep'||c.flow==='until')return stmtEnd(list,i+1);
  if(c.flow==='else')return stmtEnd(list,i+1);
  return i+1;
}
const MAX_STEPS=700,MAX_DEPTH=64;
function newPot(init){const p={water:false,waterAt:0,noodle:false,soup:false,pa:false,egg:false,paBoil:false,eggBoil:false,dead:false};
  if(init!==undefined){p.water=true;p.waterAt=-init;p.noodle=true;p.soup=true;}return p;}
function trace(level,day,prog){
  const pots=Array.from({length:level.pots},(_,i)=>newPot(day.start?day.start[i]:undefined));
  let cur=0,clock=0,money=0,served=0,spare=level.spare||0,reason='end',bumps=0,checks=0,actions=0;
  const steps=[],stack=[];const limit=level.limit*FPS,order=day.order||null;
  const snap=()=>pots.map(p=>({...p}));
  const fOf=p=>p.water?clock-p.waterAt:-1;
  class Halt extends Error{constructor(r){super(r);this.r=r;}}
  const rec=(cmd,dur,extra={})=>{
    if(steps.length>=MAX_STEPS)throw new Halt('steps');
    steps.push({cmd,clock,dur,cur,money,served,spare,before:snap(),stack:stack.map(s=>({...s})),...extra});
  };
  const ask=q=>{const p=pots[cur],f=fOf(p),o=order?order[served]:null;
    if(q==='B')return f>=BOIL;if(q==='D')return f>=DONE;if(q==='G')return !!(o&&o.egg);return !!(o&&o.pa);};
  const tickTo=d=>{clock+=d;if(clock>limit)throw new Halt('time');};
  function act(c){
    const p=pots[cur];let ok=true,note='',out=null;
    if(p.dead)ok=false,note='이 냄비는 없습니다';
    else if(c==='W'){if(p.water)ok=false,note='이미 물이 있습니다';}
    else if(c==='N'){if(p.noodle)ok=false,note='라면이 이미 있습니다';}
    else if(c==='S'){if(p.soup)ok=false,note='스프가 이미 있습니다';}
    else if(c==='P'){if(p.pa)ok=false,note='파가 이미 있습니다';}
    else if(c==='G'){if(p.egg)ok=false,note='계란이 이미 있습니다';}
    else if(c==='V'){if(!p.water&&!p.noodle&&!p.soup){ok=false;note='빈 냄비입니다';}}
    if(c==='V'&&ok){const f=fOf(p);out=scoreOf(p,f);const o=order?order[served]:null;
      if(o&&(!!o.egg!==p.egg||!!o.pa!==p.pa)){out={won:0,talk:9,why:'주문과 재료가 다릅니다'};}
      out.f=f;}
    if(!ok)bumps++;actions++;
    // 할 수 없는 동작은 헛돌기만 하고 시간을 쓰지 않는다. 시간이 들면 이미 넣은 재료를 다시 넣는 것이 [기다리기] 대신 쓰인다
    rec(c,ok?ACT:0,{ok,note,out,f:fOf(p)});
    const at=clock;if(ok)tickTo(ACT);
    if(ok){
      if(c==='W'){p.water=true;p.waterAt=clock;}
      else if(c==='N')p.noodle=true;else if(c==='S')p.soup=true;
      else if(c==='P'){p.pa=true;p.paBoil=(p.water&&at-p.waterAt>=BOIL);}
      else if(c==='G'){p.egg=true;p.eggBoil=(p.water&&at-p.waterAt>=BOIL);}
      else if(c==='V'){money+=out.won;served++;
        const q=newPot();if(out.burned){if(spare>0)spare--;else q.dead=true;}Object.assign(p,q);
        if(money>=day.target)throw new Halt('win');}
    }
  }
  function run(p,depth){stack.push({p,i:0});const list=prog[p];let i=0;while(i<list.length)i=stmt(list,i);stack.pop();}
  function stmt(list,i){
    if(i>=list.length)return i;
    const t=list[i],c=CMD[t],top=stack[stack.length-1];top.i=i;
    if(c.flow==='else')return stmtEnd(list,i);   // 참 쪽을 마치고 왔거나 짝이 없는 [아니면]: 건너뛴다
    if(c.flow==='if'){const r=ask(c.q);checks++;rec(t,0,{q:c.q,result:r});
      const j=stmtEnd(list,i+1);
      if(r){stmt(list,i+1);top.i=i;return list[j]==='E'?stmtEnd(list,j+1):j;}
      if(list[j]==='E'){stmt(list,j+1);return stmtEnd(list,j+1);}
      return j;}
    if(c.flow==='rep'){for(let k=0;k<c.n;k++){top.i=i;rec(t,0,{rep:k+1});stmt(list,i+1);}return stmtEnd(list,i+1);}
    if(c.flow==='until'){for(;;){top.i=i;const r=ask(c.q);checks++;rec(t,0,{q:c.q,result:r});if(r)break;if(i+1>=list.length)throw new Halt('hang');stmt(list,i+1);}return stmtEnd(list,i+1);}
    if(c.fn){if(stack.length>=MAX_DEPTH)throw new Halt('stack');run(c.fn,stack.length);return i+1;}
    if(t==='X'){rec(t,0);cur=(cur+1)%pots.length;return i+1;}
    if(t==='T'){actions++;rec(t,ACT);tickTo(ACT);return i+1;}
    act(t);return i+1;
  }
  try{run('main',0);}catch(e){if(e instanceof Halt)reason=e.r;else throw e;}
  steps.push({cmd:null,clock,dur:0,cur,money,served,spare,before:snap(),stack:[]});
  return{steps,reason,win:reason==='win',money,bumps,checks,actions,clock,target:day.target};
}

  if(show){bubble.removeAttribute('display');bubbleT.textContent=TALK[last.out.talk]||'';bubbleS.textContent=`${last.out.won.toLocaleString()}원 · 물 ${last.out.f}프레임`;}else bubble.setAttribute('display','none');

  else if(c&&step.ok===false&&state.ran)flag(q,step.note,'#e2504c');

function blockEl(c){const x=CMD[c],b=document.createElement('button');b.type='button';b.className='blk'+(x.fn?' fn':'')+(x.flow?' flow':'');b.style.setProperty('--c',`var(${x.c})`);

  const sp=document.createElement('span');sp.textContent=x.label;b.append(sp);b.title=x.label;return b;}
function thumbOf(c){const i=document.createElement('img');i.src=ART+CMD[c].sprite+'.png';i.alt='';i.draggable=false;return i;}

let codeLines=new Map();
function renderCode(){const box=$('code');box.innerHTML='';codeLines=new Map();
  const line=(t,cls,key)=>{const d=document.createElement('span');d.className='ln'+(cls?' '+cls:'');d.textContent=t||' ';box.append(d);if(key)codeLines.set(key,d);};
  const emit=(p,list,i,ind)=>{const t=list[i],c=CMD[t],key=`${p}:${i}`;
    if(c.flow==='if'){line(`${ind}if ${c.code}:`,'',key);if(i+1>=list.length){line(ind+'    pass');return list.length;}const j=emit(p,list,i+1,ind+'    ');if(list[j]!=='E')return j;line(ind+'else:','',`${p}:${j}`);if(j+1>=list.length){line(ind+'    pass');return list.length;}return emit(p,list,j+1,ind+'    ');}

    if(c.flow==='else'){line(ind+'# 짝이 없는 아니면과 다음 블록은 건너뜁니다','',key);return stmtEnd(list,i);}

let drag=null,lastDrop=null;const ghost=$('ghost');

addEventListener('pointerdown',e=>{const b=e.target.closest('.blk');if(!b||e.button!==0||b.closest('#ghost'))return;drag=b.dataset.palette?{cmd:b.dataset.palette,from:null}:{cmd:state.program[b.dataset.slotPanel][+b.dataset.slotI],from:{p:b.dataset.slotPanel,i:+b.dataset.slotI}};drag.x=e.clientX;drag.y=e.clientY;drag.started=false;});

    if(nx>=0){showBanner('win',`<h2>${state.day+1}일째 통과</h2><p>같은 프로그램으로 다음 영업일을 실행합니다.</p>`);pendingDay=nx;dayWait=1.4;syncUI(true);return;}}
  if(rec.win){const st_=starsFor(blocks);save.stars[state.level]=Math.max(save.stars[state.level]||0,st_);persist();renderLevels();window.GameRecord.report({stage:state.level+1,stageName:l.name,stars:st_,blocks,result:`${(rec.clock/FPS).toFixed(0)}초(기다림 ${waitOf(rec)}초), ${rec.money.toLocaleString()}원`,program:programText()});const next=state.level<LEVELS.length-1;state.passed[state.day]=true;
    showBanner('win',`<h2>목표를 채웠습니다<span class="stars">${'★'.repeat(st_)}${'☆'.repeat(3-st_)}</span></h2><p>블록 <b>${blocks}</b>개로 <b>${(rec.clock/FPS).toFixed(0)}초</b> 만에 <b>${rec.money.toLocaleString()}원</b>을 벌었습니다. ${waitOf(rec)?`그중 <b>${waitOf(rec)}초</b>는 기다리기만 했습니다.`:'기다리기만 한 시간은 없었습니다.'}${compareLine(l)} ${l.after}</p><div class="row"><button id="b-close">더 줄여 보기</button>${next?'<button class="primary" id="b-next">다음 문제 ▶</button>':''}</div>`);
    $('b-close').onclick=()=>{hideBanner();finished=false;state.t=0;state.ran=false;syncUI(true);};if(next)$('b-next').onclick=()=>goLevel(state.level+1);}
  else{const why={end:`프로그램이 끝났는데 목표까지 ${(rec.target-rec.money).toLocaleString()}원이 모자랍니다.`,time:`제한 시간 ${l.limit}초가 지났습니다. 목표까지 ${(rec.target-rec.money).toLocaleString()}원이 모자랍니다.`,steps:`실행이 ${MAX_STEPS}단계를 넘어 멈췄습니다. 끝나지 않는 반복이 있는지 살펴보세요.`,stack:`호출이 ${MAX_DEPTH}단계까지 쌓여 멈췄습니다.`,hang:'[때까지] 다음에 되풀이할 블록이 없습니다.'}[rec.reason];
    const bump=rec.bumps?` 명령 ${rec.bumps}개가 헛돌았습니다(흐린 막대).`:'';
    showBanner('',`<h2>${ds.length>1?`${state.day+1}일째: `:''}아직 모자랍니다</h2><p>${why}${bump} 막대를 되감아 어디서 어긋났는지 찾아 보세요.</p><div class="row"><button id="b-close">확인</button></div>`);
    $('b-close').onclick=()=>{hideBanner();finished=false;state.t=0;state.ran=false;syncUI(true);};}
  syncUI(true);}
function toggleRun(){if(!countBlocks(state.program))return;if(state.playing){state.playing=false;syncUI(true);return;}
  if(state.t>=1||!state.ran){state.t=0;finished=false;hideBanner();}state.ran=true;state.playing=true;if(!nSteps()){state.t=1;state.playing=false;finish();}syncUI(true);}
function stepBy(k){const n=nSteps();if(!n)return;state.ran=true;state.playing=false;const s=k>0?Math.floor(S()+1e-6)+1:Math.ceil(S()-1e-6)-1;state.t=clamp(s/n,0,1);if(state.t<1){finished=false;hideBanner();}else finish();syncUI(true);}
let scrubbing=false;const range=$('range');
$('run').onclick=toggleRun;$('step').onclick=()=>stepBy(1);$('back').onclick=()=>stepBy(-1);
$('rew').onclick=()=>{state.t=0;state.playing=false;finished=false;hideBanner();syncUI(true);};
$('speed').onchange=e=>{state.speed=+e.target.value;};$('clear').onclick=()=>mutate(()=>{state.program=emptyP();});
range.addEventListener('pointerdown',()=>{scrubbing=true;state.playing=false;syncUI(true);});
range.addEventListener('input',()=>{state.t=+range.value/1000;if(state.t<1){finished=false;hideBanner();}else finish();syncUI(true);});
for(const n of ['pointerup','pointercancel','blur'])range.addEventListener(n,()=>{scrubbing=false;});
$('b-rules').onclick=()=>toggleRules($('rules').hidden);
addEventListener('keydown',e=>{if(e.code==='Escape'&&!$('rules').hidden){toggleRules(false);return;}if(e.code==='Space'){e.preventDefault();document.activeElement&&document.activeElement.blur&&document.activeElement.blur();toggleRun();}
  else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();stepBy(e.key==='ArrowRight'?1:-1);}
  else if(e.key==='Backspace'){e.preventDefault();if(state.program[state.active].length)mutate(()=>state.program[state.active].pop());}});

// ───────── 루프 ─────────
function resize(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1672,innerHeight/941));}
addEventListener('resize',resize);
let prev=performance.now(),acc=0;
function frame(now){const dt=Math.min((now-prev)/1000,.1);prev=now;
  if(state.playing){const n=nSteps();state.t=clamp(state.t+dt/(Math.max(n,1)*state.speed),0,1);if(state.t>=1){state.playing=false;finish();}}
  if(dayWait>0){dayWait-=dt;if(dayWait<=0){setDay(pendingDay);state.ran=true;state.playing=true;syncUI(true);}}
  render();acc+=dt;if(acc>.05){syncUI();acc=0;}requestAnimationFrame(frame);}

// ───────── 자가 점검 API ─────────
function snapshot(){const n=nSteps();return{level:state.level+1,day:state.day,passed:state.passed.slice(),t:state.t,ran:state.ran,finished,program:JSON.parse(JSON.stringify(state.program)),run:{win:rec.win,reason:rec.reason,money:rec.money,seconds:rec.clock/FPS,steps:n,bumps:rec.bumps,checks:rec.checks,actions:rec.actions}};}
window.ramenApp={snapshot,trace,LEVELS,CMD,parseProg,
  checkLevels(){return LEVELS.map((l,i)=>{const p=parseProg(l.sol),rs=l.days.map(d=>trace(l,d,p));return{no:i+1,name:l.name,win:rs.every(r=>r.win),days:rs.map(r=>`${r.reason}:${r.money}원/${(r.clock/FPS).toFixed(0)}초`).join(' | '),fits:PANELS.every((k,j)=>p[k].length<=l.slots[j]),usable:Object.values(p).flat().every(c=>{const x=CMD[c];return x.fn?l.slots[PANELS.indexOf(x.fn)]>0:!(l.ban||[]).includes(c)&&(BASE.includes(c)||l.use.includes(c));}),bumps:rs.map(r=>r.bumps).join(),blocks:l.par};});},
  setState(o={}){if(o.level!==undefined)goLevel(clamp(o.level-1,0,LEVELS.length-1));if(o.day!==undefined)setDay(o.day);if(o.program){const p=emptyP();for(const k of PANELS)p[k]=[...(o.program[k]||[])];state.program=p;state.passed=[];resetRun();renderDays();renderProgram();}if(o.solution){state.program=parseProg(L().sol);state.passed=[];resetRun();renderDays();renderProgram();}if(o.t!==undefined){state.ran=true;state.t=clamp(o.t,0,1);finished=false;hideBanner();if(state.t>=1)finish();}if(o.speed)state.speed=o.speed;render();syncUI(true);return snapshot();}};

// ───────── 시작 ─────────
resize();goLevel(state.level);render();syncUI(true);$('loading').hidden=true;requestAnimationFrame(frame);
</script>
</body>
