<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Whitetone 스타일 참조 — 샘플 슬라이드</title>
<style>
  /* Whitetone 스타일 참조 이미지 소스 (1600×900 @2x 스크린샷용)
     — 오프화이트 + 얇은 균일 스트로크 벡터 + 4색 절제 팔레트, 캐릭터 없음 */
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1600px;height:900px;overflow:hidden;}
  body{
    background:#FDFDFB;
    font-family:'Pretendard','Noto Sans KR','Segoe UI',sans-serif;
    color:#33415C;
    position:relative;
  }
  .stage{position:absolute;inset:0;padding:72px 90px;}

  .kicker{
    font-size:22px;letter-spacing:.32em;text-transform:uppercase;
    color:#3E9C93;font-weight:700;margin-bottom:14px;
  }
  h1{
    font-size:58px;font-weight:800;letter-spacing:-0.01em;line-height:1.15;
    color:#33415C;word-break:keep-all;
  }
  h1 .accent{color:#3E9C93;}
  .rule{width:120px;height:3px;background:#3E9C93;border-radius:2px;margin:26px 0 0;}

  .diagram{position:absolute;left:90px;top:300px;}
  .panel{position:absolute;right:90px;top:290px;width:520px;}

  .code{
    border:2px solid #33415C;border-radius:14px;
    padding:26px 30px;font-family:'Cascadia Code','D2Coding',monospace;
    font-size:26px;line-height:1.7;color:#33415C;background:#FDFDFB;
  }
  .code .kw{color:#3E9C93;font-weight:700;}
  .code .str{color:#E4B04A;}
  .callout{
    margin-top:26px;border:2px solid #E8705A;border-radius:14px;
    padding:20px 26px;font-size:24px;line-height:1.55;color:#E8705A;
    display:flex;gap:14px;align-items:flex-start;font-weight:600;
  }
  .callout svg{flex:none;margin-top:3px;}

  .caption{
    position:absolute;left:90px;bottom:60px;font-size:22px;color:#33415C;
    opacity:.72;letter-spacing:.02em;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="kicker">Lesson · Sample Plate</div>
  <h1>조건이 흐름을 가른다 — <span class="accent">if / else</span></h1>
  <div class="rule"></div>

  <!-- 좌: 얇은 스트로크 플로차트 (결정 마름모 + 두 갈래) -->
  <svg class="diagram" width="640" height="440" viewBox="0 0 640 440" fill="none">
    <!-- 시작 캡슐 -->
    <rect x="240" y="8" width="160" height="58" rx="29" stroke="#33415C" stroke-width="3"/>
    <text x="320" y="45" text-anchor="middle" font-size="24" fill="#33415C" font-weight="600">시작</text>
    <line x1="320" y1="66" x2="320" y2="112" stroke="#33415C" stroke-width="3" stroke-linecap="round"/>
    <path d="M320 112 l-8 -14 h16 z" fill="#33415C"/>

    <!-- 결정 마름모 (틸) -->
    <path d="M320 120 L470 205 L320 290 L170 205 Z" stroke="#3E9C93" stroke-width="3.5"/>
    <text x="320" y="198" text-anchor="middle" font-size="26" fill="#3E9C93" font-weight="700">점수 ≥ 60 ?</text>
    <text x="320" y="232" text-anchor="middle" font-size="20" fill="#3E9C93">조건식</text>

    <!-- True 갈래 (머스터드 하이라이트) -->
    <line x1="470" y1="205" x2="560" y2="205" stroke="#33415C" stroke-width="3" stroke-linecap="round"/>
    <line x1="560" y1="205" x2="560" y2="320" stroke="#33415C" stroke-width="3" stroke-linecap="round"/>
    <path d="M560 320 l-8 -14 h16 z" fill="#33415C"/>
    <text x="512" y="192" text-anchor="middle" font-size="21" fill="#3E9C93" font-weight="700">True</text>
    <rect x="470" y="330" width="180" height="62" rx="14" stroke="#E4B04A" stroke-width="3.5"/>
    <text x="560" y="369" text-anchor="middle" font-size="24" fill="#33415C" font-weight="600">"통과" 출력</text>

    <!-- False 갈래 (코랄) -->
    <line x1="170" y1="205" x2="80" y2="205" stroke="#33415C" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="205" x2="80" y2="320" stroke="#33415C" stroke-width="3" stroke-linecap="round"/>
    <path d="M80 320 l-8 -14 h16 z" fill="#33415C"/>
    <text x="126" y="192" text-anchor="middle" font-size="21" fill="#E8705A" font-weight="700">False</text>
    <rect x="0" y="330" width="180" height="62" rx="14" stroke="#E8705A" stroke-width="3"/>
    <text x="90" y="369" text-anchor="middle" font-size="24" fill="#33415C" font-weight="600">"재도전" 출력</text>
  </svg>

  <!-- 우: 코드 박스 + 실수 콜아웃 -->
  <div class="panel">
    <div class="code">
      <span class="kw">if</span> 점수 &gt;= 60:<br>
      &nbsp;&nbsp;&nbsp;&nbsp;print(<span class="str">"통과"</span>)<br>
      <span class="kw">else</span>:<br>
      &nbsp;&nbsp;&nbsp;&nbsp;print(<span class="str">"재도전"</span>)
    </div>
    <div class="callout">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <path d="M15 3 L28 26 H2 Z" stroke="#E8705A" stroke-width="2.5" stroke-linejoin="round"/>
        <line x1="15" y1="12" x2="15" y2="19" stroke="#E8705A" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="15" cy="22.6" r="1.6" fill="#E8705A"/>
      </svg>
      <span>콜론(:)과 들여쓰기를 잊으면<br>파이썬은 갈림길을 못 찾아요</span>
    </div>
  </div>

  <div class="caption">whitetone · clean minimal vector — thin uniform strokes, four soft accents, generous whitespace</div>
</div>
</body>
</html>
