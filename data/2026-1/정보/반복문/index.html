<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if(!location.pathname.endsWith('/')&&!location.pathname.endsWith('.html')){var b=document.createElement('base');b.href=location.pathname+'/';document.head.appendChild(b);}</script>
<title>반복문 — 고등학생 파이썬 입문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Sans+KR:wght@400;500&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F5F6;
    --ink:#222428;
    --ink-soft:#5D6168;
    --rule:#2A2D33;
    --wash:rgba(34,36,40,0.06);
    --marker-blue:#1E5BD0;
    --marker-red:#D6263A;
    --marker-green:#1B9E4B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'EB Garamond','Noto Sans KR',Georgia,serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* Top progress bar — hairline */
  .progress{
    position:fixed;top:0;left:0;height:2px;width:0%;
    background:var(--marker-blue);transition:width .35s ease;z-index:20;
  }

  /* Frame */
  .stage{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    padding:32px 56px 64px;
  }

  /* Slide area — 16:9 letterboxed */
  .slide-frame{
    position:relative;
    width:min(100%, calc((100vh - 96px) * 16 / 9));
    aspect-ratio:16/9;
    background:var(--paper);
    border:1px solid var(--rule);
    box-shadow:
      0 0 0 6px var(--paper),
      0 0 0 7px rgba(34,36,40,0.16);
  }

  .slide{
    position:absolute;inset:0;
    opacity:0;transition:opacity .45s ease;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .slide.active{opacity:1;pointer-events:auto;}
  .slide img{
    width:100%;height:100%;
    object-fit:contain;
    display:block;
    user-select:none;-webkit-user-drag:none;
  }

  /* Footer ribbon — pagination + caption */
  .ribbon{
    position:fixed;left:0;right:0;bottom:0;
    height:48px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 28px;
    background:var(--paper);
    border-top:1px solid var(--rule);
    z-index:15;
    font-family:'EB Garamond',Georgia,serif;
  }
  .ribbon .meta{
    font-style:italic;
    color:var(--ink-soft);
    font-size:13px;
    letter-spacing:0.02em;
  }
  .ribbon .counter{
    font-variant-numeric:tabular-nums;
    letter-spacing:0.18em;
    font-size:13px;
    color:var(--ink);
  }
  .ribbon .center{
    position:absolute;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:18px;
    font-size:12px;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:0.28em;
    font-family:'EB Garamond',Georgia,serif;
  }
  .ribbon .em-rule{
    display:inline-block;width:24px;height:1px;background:var(--ink-soft);
    vertical-align:middle;
  }
  .ribbon .marker-dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--marker-blue);vertical-align:middle;margin:0 2px;
  }
  .ribbon .marker-dot.red{background:var(--marker-red);}
  .ribbon .marker-dot.green{background:var(--marker-green);}

  /* Side nav buttons */
  .nav-btn{
    position:fixed;top:50%;transform:translateY(-50%);
    width:44px;height:44px;
    background:transparent;border:1px solid var(--rule);
    color:var(--ink);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .2s ease, transform .15s ease;
    z-index:18;
  }
  .nav-btn:hover{background:var(--wash);}
  .nav-btn:active{transform:translateY(-50%) scale(0.96);}
  .nav-btn.prev{left:14px;}
  .nav-btn.next{right:14px;}
  .nav-btn svg{width:18px;height:18px;}
  .nav-btn:disabled{opacity:0.25;cursor:default;}

  /* Index toggle + panel */
  .index-toggle{
    position:fixed;top:14px;right:14px;
    background:transparent;border:1px solid var(--rule);
    color:var(--ink);
    padding:6px 12px;font:italic 12px/1 'EB Garamond',Georgia,serif;
    letter-spacing:0.06em;cursor:pointer;z-index:18;
  }
  .index-toggle:hover{background:var(--wash);}
  .index-panel{
    position:fixed;inset:0;
    background:rgba(244,245,246,0.96);
    display:none;
    flex-direction:column;align-items:center;justify-content:center;
    z-index:25;padding:48px;
  }
  .index-panel.open{display:flex;}
  .index-panel h2{
    font:italic 26px 'EB Garamond',serif;
    margin-bottom:8px;color:var(--ink);letter-spacing:0.02em;
  }
  .index-panel .sub{
    font:13px 'EB Garamond',serif;letter-spacing:0.32em;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:24px;
  }
  .index-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
    gap:14px;
    width:min(1100px,90%);
    max-height:70vh;overflow-y:auto;
    padding:8px 4px;
  }
  .thumb{
    position:relative;
    border:1px solid var(--rule);
    aspect-ratio:16/9;background:var(--paper);
    cursor:pointer;overflow:hidden;
    transition:transform .15s ease;
  }
  .thumb:hover{transform:translateY(-2px);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .num{
    position:absolute;bottom:4px;right:6px;
    font:11px 'EB Garamond',serif;font-variant-numeric:tabular-nums;
    color:var(--ink-soft);background:var(--paper);
    padding:1px 5px;border:1px solid var(--ink-soft);
  }
  .index-close{
    position:absolute;top:24px;right:24px;
    background:transparent;border:none;cursor:pointer;
    font:italic 14px 'EB Garamond',serif;color:var(--ink);
    letter-spacing:0.06em;
  }

  /* Corner caption */
  .corner-note{
    position:fixed;top:16px;left:24px;
    font:italic 12px 'EB Garamond',serif;
    color:var(--ink-soft);letter-spacing:0.04em;z-index:18;
  }
  .corner-note .roman{letter-spacing:0.16em;}

  /* ── HTML whiteboard slides (9–11): ODP 원문 연습·응용 문제 ── */
  .slide-frame{container-type:size;}
  .wb{
    width:100%;height:100%;
    padding:3.6cqh;
    background:#EDEEEF;
  }
  .wb-board{
    width:100%;height:100%;
    background:#FCFCFB;
    border:0.9cqh solid #3A3D42;
    border-radius:2.8cqh;
    box-shadow:inset 0 0 7cqh rgba(34,36,40,0.05);
    padding:4cqh 5.4cqh 4.4cqh;
    display:flex;flex-direction:column;
    font-family:'Gaegu','Noto Sans KR',sans-serif;
    text-align:left;
  }
  .wb-title{
    font:700 6.4cqh/1.2 'Gaegu','Noto Sans KR',sans-serif;
    color:#1E2024;
  }
  .wb-rule{width:34cqh;height:0.6cqh;border-radius:99px;margin-top:1.1cqh;}
  .wb-rule.blue{background:var(--marker-blue);}
  .wb-rule.red{background:var(--marker-red);}
  .wb-problems{
    flex:1;display:flex;flex-direction:column;
    justify-content:space-evenly;
    margin-top:1.6cqh;
  }
  .wb-card{
    position:relative;
    border:0.45cqh solid var(--c);
    border-radius:2.2cqh;
    background:#FFFFFF;
    box-shadow:0.7cqh 0.9cqh 0 rgba(34,36,40,0.08);
    padding:3.6cqh 4cqh 3cqh 4.6cqh;
    margin-top:2.8cqh;
  }
  .wb-card.blue{--c:var(--marker-blue);}
  .wb-card.green{--c:var(--marker-green);}
  .wb-card.red{--c:var(--marker-red);}
  .wb-badge{
    position:absolute;top:-2.6cqh;left:3.2cqh;
    background:var(--c);color:#fff;
    font:700 3.6cqh/1 'Gaegu','Noto Sans KR',sans-serif;
    padding:1.1cqh 2.6cqh 0.9cqh;
    border-radius:99px;
    transform:rotate(-1.6deg);
    letter-spacing:0.05em;
    box-shadow:0.3cqh 0.4cqh 0 rgba(34,36,40,0.18);
  }
  .wb-card p{
    font:400 4.9cqh/1.42 'Gaegu','Noto Sans KR',sans-serif;
    color:#26282C;
  }
  .wb-card .kw{font-weight:700;}
  .wb-card .kw.blue{color:var(--marker-blue);}
  .wb-card .kw.green{color:var(--marker-green);}
  .wb-card .kw.red{color:var(--marker-red);}
  .wb-card mark{
    background:linear-gradient(transparent 38%, #FFE873 38%, #FFE873 94%, transparent 94%);
    color:inherit;
  }
  .thumb.thumb-html{display:flex;align-items:center;justify-content:center;background:#FCFCFB;}
  .thumb.thumb-html .label{
    font:700 14px/1.3 'Gaegu','Noto Sans KR',sans-serif;
    color:var(--ink);text-align:center;padding:6px;
  }

  @media print{
    body{background:white;}
    .ribbon,.nav-btn,.index-toggle,.corner-note,.progress{display:none;}
    .stage{padding:0;}
    .slide-frame{border:none;box-shadow:none;width:100%;height:100vh;}
  }

  @media (max-width: 720px){
    .stage{padding:14px 14px 56px;}
    .nav-btn{width:36px;height:36px;}
    .ribbon{height:42px;padding:0 14px;font-size:12px;}
    .ribbon .center{display:none;}
    .corner-note{display:none;}
  }
</style>
</head>
<body>

<div class="progress" id="progress"></div>

<aside class="corner-note">
  <span class="roman">— xiii —</span> &nbsp; 반복문 · 고등학생 파이썬 입문
</aside>

<button class="index-toggle" id="indexToggle">— index —</button>

<div class="stage">
  <div class="slide-frame" id="frame" aria-roledescription="presentation"></div>
</div>

<button class="nav-btn prev" id="prev" aria-label="이전 슬라이드">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
</button>
<button class="nav-btn next" id="next" aria-label="다음 슬라이드">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
</button>

<footer class="ribbon">
  <div class="meta"><em>For &amp; While Loops</em> — a whiteboard primer for high-school beginners</div>
  <div class="center">
    <span class="em-rule"></span>
    <span>Whiteboard · Session</span>
    <span class="marker-dot"></span>
    <span class="marker-dot red"></span>
    <span class="marker-dot green"></span>
    <span class="em-rule"></span>
  </div>
  <div class="counter" id="counter">01 / 13</div>
</footer>

<div class="index-panel" id="indexPanel" role="dialog" aria-modal="true" aria-label="슬라이드 목차">
  <button class="index-close" id="indexClose">— close —</button>
  <h2>Whiteboard Plates</h2>
  <div class="sub">반복문 · 13 slides</div>
  <div class="index-grid" id="indexGrid"></div>
</div>

<!-- HTML 슬라이드 (9–11) — "15. 반복문.odp" 연습·응용 문제 원문 -->
<template id="slide-html-09">
  <div class="wb">
    <div class="wb-board">
      <h1 class="wb-title">반복문 연습 ① · ② — 직접 코드를 작성해 보자.</h1>
      <div class="wb-rule blue"></div>
      <div class="wb-problems">
        <div class="wb-card blue">
          <span class="wb-badge">반복문 연습 1</span>
          <p>변수 <span class="kw blue">text</span>에 아무 문자 데이터나 저장하고,<br>반복문 <span class="kw blue">for</span>을 활용하여 <mark>다섯 번</mark> 출력되는 프로그램 작성</p>
        </div>
        <div class="wb-card green">
          <span class="wb-badge">반복문 연습 2</span>
          <p>변수 <span class="kw green">text</span>에 아무 문자 데이터나 저장하고,<br>반복문 <span class="kw green">while</span>을 활용하여 <mark>다섯 번</mark> 출력되는 프로그램 작성</p>
        </div>
      </div>
    </div>
  </div>
</template>
<template id="slide-html-10">
  <div class="wb">
    <div class="wb-board">
      <h1 class="wb-title">반복문 연습 ③ · ④ — 입력과 범위를 다뤄 보자.</h1>
      <div class="wb-rule blue"></div>
      <div class="wb-problems">
        <div class="wb-card blue">
          <span class="wb-badge">반복문 연습 3</span>
          <p>변수 <span class="kw blue">x</span>에 사용자로부터 숫자 값을 입력 받고,<br>반복문 <span class="kw blue">for</span>를 활용하여 <mark>x번</mark> 아무 출력이나 반복하는 프로그램 만들기</p>
        </div>
        <div class="wb-card green">
          <span class="wb-badge">반복문 연습 4</span>
          <p>반복문 <span class="kw green">for</span> 혹은 <span class="kw green">while</span>을 활용하여<br><mark>1부터 20까지</mark> 출력하는 프로그램 만들기</p>
        </div>
      </div>
    </div>
  </div>
</template>
<template id="slide-html-11">
  <div class="wb">
    <div class="wb-board">
      <h1 class="wb-title">응용 문제 ① · ② — 배운 반복문을 한 단계 깊게.</h1>
      <div class="wb-rule red"></div>
      <div class="wb-problems">
        <div class="wb-card red">
          <span class="wb-badge">응용 문제 1</span>
          <p>반복문을 활용하여 <mark>1부터 31까지 홀수만</mark> 출력되는 프로그램 만들기</p>
        </div>
        <div class="wb-card red">
          <span class="wb-badge">응용 문제 2</span>
          <p>반복문을 <span class="kw red">중첩</span>하여 활용하여 <mark>구구단</mark>을 출력하는 프로그램 만들기</p>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
  const TOTAL = 13;
  const frame = document.getElementById('frame');
  const counter = document.getElementById('counter');
  const progress = document.getElementById('progress');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const indexToggle = document.getElementById('indexToggle');
  const indexPanel = document.getElementById('indexPanel');
  const indexClose = document.getElementById('indexClose');
  const indexGrid = document.getElementById('indexGrid');

  let current = 0;

  function pad(n){return String(n).padStart(2,'0');}

  // 9~11번: ODP 원문 연습·응용 문제를 담은 HTML 템플릿 슬라이드
  const HTML_SLIDE_LABELS = {
    9: '연습 문제 ① · ②',
    10: '연습 문제 ③ · ④',
    11: '응용 문제 ① · ②'
  };

  for (let i = 1; i <= TOTAL; i++) {
    const num = pad(i);
    const div = document.createElement('div');
    div.className = 'slide' + (i === 1 ? ' active' : '');
    div.dataset.idx = i - 1;
    const tpl = document.getElementById('slide-html-' + num);
    if (tpl) {
      div.appendChild(tpl.content.cloneNode(true));
    } else {
      const img = document.createElement('img');
      img.src = 'images/slide-' + num + '.png';
      img.alt = '슬라이드 ' + i;
      img.loading = i <= 2 ? 'eager' : 'lazy';
      div.appendChild(img);
    }
    frame.appendChild(div);
  }

  for (let i = 1; i <= TOTAL; i++) {
    const num = pad(i);
    const t = document.createElement('div');
    t.className = 'thumb';
    t.dataset.idx = i - 1;
    if (HTML_SLIDE_LABELS[i]) {
      t.classList.add('thumb-html');
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = HTML_SLIDE_LABELS[i];
      t.appendChild(label);
    } else {
      const tImg = document.createElement('img');
      tImg.src = 'images/slide-' + num + '.png';
      tImg.alt = '슬라이드 ' + i;
      tImg.loading = 'lazy';
      t.appendChild(tImg);
    }
    const n = document.createElement('span');
    n.className = 'num';
    n.textContent = num;
    t.appendChild(n);
    indexGrid.appendChild(t);
  }

  const slides = Array.from(frame.querySelectorAll('.slide'));

  function show(idx){
    if (idx < 0) idx = 0;
    if (idx > TOTAL - 1) idx = TOTAL - 1;
    slides[current].classList.remove('active');
    slides[idx].classList.add('active');
    current = idx;
    counter.textContent = pad(current+1) + ' / ' + pad(TOTAL);
    progress.style.width = ((current+1)/TOTAL*100) + '%';
    prevBtn.disabled = (current === 0);
    nextBtn.disabled = (current === TOTAL - 1);
  }

  function next(){ show(current + 1); }
  function prev(){ show(current - 1); }

  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);

  document.addEventListener('keydown', (e) => {
    if (indexPanel.classList.contains('open')) {
      if (e.key === 'Escape') closeIndex();
      return;
    }
    if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft','PageUp','Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(TOTAL - 1);
    else if (e.key === 'Escape') closeIndex();
    else if (e.key === 'g' || e.key === 'G') openIndex();
  });

  let wheelLock = false;
  window.addEventListener('wheel', (e) => {
    if (wheelLock) return;
    if (Math.abs(e.deltaY) < 8) return;
    wheelLock = true;
    setTimeout(() => wheelLock = false, 420);
    if (e.deltaY > 0) next(); else prev();
  }, { passive: true });

  let tx = null, ty = null;
  window.addEventListener('touchstart', e => {
    const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY;
  }, { passive: true });
  window.addEventListener('touchend', e => {
    if (tx === null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) next(); else prev();
    }
    tx = ty = null;
  }, { passive: true });

  frame.addEventListener('click', (e) => {
    const rect = frame.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x < rect.width / 3) prev(); else next();
  });

  function openIndex(){ indexPanel.classList.add('open'); }
  function closeIndex(){ indexPanel.classList.remove('open'); }
  indexToggle.addEventListener('click', openIndex);
  indexClose.addEventListener('click', closeIndex);
  indexGrid.addEventListener('click', (e) => {
    const t = e.target.closest('.thumb');
    if (!t) return;
    show(parseInt(t.dataset.idx, 10));
    closeIndex();
  });

  show(0);
</script>
<script type="module" src="../../../../live/runtime/live.js?v=3"></script>
  <script type="module" src="../../../../live/runtime/chrome.js?v=2"></script>
</body>
</html>
