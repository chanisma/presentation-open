<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1600px;height:900px;background:#FDFDFB;font-family:'Noto Sans KR',sans-serif;overflow:hidden;}
  .slide{width:1600px;height:900px;padding:70px 90px;position:relative;}
  h1{font-size:52px;font-weight:700;color:#3E9C93;letter-spacing:-0.01em;}
  .sub{font-size:24px;color:#33415C;opacity:.72;margin-top:14px;font-weight:400;}
  .rule{width:96px;height:3px;background:#E4B04A;border-radius:2px;margin:26px 0 0;}
  .body{display:flex;align-items:center;gap:80px;margin-top:56px;}
  .caption{font-size:19px;color:#33415C;opacity:.66;margin-top:18px;text-align:center;}
  .bullets{list-style:none;margin-top:46px;}
  .bullets li{font-size:23px;color:#33415C;margin-bottom:22px;display:flex;align-items:flex-start;gap:14px;line-height:1.5;}
  .dot{width:9px;height:9px;border-radius:50%;background:#3E9C93;margin-top:11px;flex:none;}
  .dot.coral{background:#E8705A;}
  .dot.mustard{background:#E4B04A;}
</style>
</head>
<body>
<div class="slide">
  <h1>관계를 표로 옮기면, 행렬이 된다</h1>
  <div class="sub">우리 반 친구 관계 그래프 → 인접행렬 A</div>
  <div class="rule"></div>

  <div class="body">
    <!-- 왼쪽: 네트워크 그래프 (동물이 노드) -->
    <svg width="520" height="470" viewBox="0 0 520 470">
      <defs>
        <g id="fox">
          <polygon points="-19,-14 -11,-30 -3,-15" fill="#E8705A"/>
          <polygon points="19,-14 11,-30 3,-15" fill="#E8705A"/>
          <circle cx="0" cy="0" r="24" fill="#E8705A"/>
          <circle cx="0" cy="7" r="15" fill="#FDFDFB"/>
          <circle cx="-8" cy="-3" r="3" fill="#33415C"/>
          <circle cx="8" cy="-3" r="3" fill="#33415C"/>
          <circle cx="0" cy="7" r="2.6" fill="#33415C"/>
        </g>
        <g id="rabbit">
          <ellipse cx="-8" cy="-27" rx="5.5" ry="15" fill="#E4B04A"/>
          <ellipse cx="8" cy="-27" rx="5.5" ry="15" fill="#E4B04A"/>
          <circle cx="0" cy="0" r="24" fill="#E4B04A"/>
          <circle cx="-8" cy="-2" r="3" fill="#33415C"/>
          <circle cx="8" cy="-2" r="3" fill="#33415C"/>
          <circle cx="0" cy="8" r="2.6" fill="#33415C"/>
        </g>
        <g id="bear">
          <circle cx="-16" cy="-17" r="8" fill="#3E9C93"/>
          <circle cx="16" cy="-17" r="8" fill="#3E9C93"/>
          <circle cx="0" cy="0" r="24" fill="#3E9C93"/>
          <circle cx="0" cy="8" r="11" fill="#FDFDFB"/>
          <circle cx="-8" cy="-3" r="3" fill="#33415C"/>
          <circle cx="8" cy="-3" r="3" fill="#33415C"/>
          <circle cx="0" cy="6" r="3" fill="#33415C"/>
        </g>
        <g id="cat">
          <polygon points="-18,-13 -12,-29 -4,-14" fill="#33415C"/>
          <polygon points="18,-13 12,-29 4,-14" fill="#33415C"/>
          <circle cx="0" cy="0" r="24" fill="#33415C"/>
          <circle cx="-8" cy="-2" r="3" fill="#FDFDFB"/>
          <circle cx="8" cy="-2" r="3" fill="#FDFDFB"/>
          <path d="M -6 9 Q 0 14 6 9" stroke="#FDFDFB" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        </g>
        <g id="bird">
          <circle cx="0" cy="0" r="21" fill="#B9C6C4"/>
          <polygon points="17,0 27,4 17,8" fill="#E4B04A"/>
          <circle cx="6" cy="-5" r="2.8" fill="#33415C"/>
          <path d="M -12 2 Q -4 10 4 2" stroke="#FDFDFB" stroke-width="2" fill="none"/>
        </g>
      </defs>

      <!-- 엣지 -->
      <g stroke="#33415C" stroke-width="2.4" stroke-linecap="round" opacity="0.45">
        <line x1="150" y1="90"  x2="360" y2="90"/>
        <line x1="150" y1="90"  x2="90"  y2="260"/>
        <line x1="360" y1="90"  x2="90"  y2="260"/>
        <line x1="360" y1="90"  x2="420" y2="260"/>
        <line x1="90"  y1="260" x2="420" y2="260"/>
        <line x1="90"  y1="260" x2="255" y2="380"/>
      </g>

      <g transform="translate(150,90)"><use href="#fox"/></g>
      <g transform="translate(360,90)"><use href="#rabbit"/></g>
      <g transform="translate(90,260)"><use href="#bear"/></g>
      <g transform="translate(420,260)"><use href="#cat"/></g>
      <g transform="translate(255,380)"><use href="#bird"/></g>

      <!-- 라벨 -->
      <g font-size="17" font-family="'Noto Sans KR',sans-serif" fill="#33415C" opacity="0.75" text-anchor="middle">
        <text x="150" y="140">가은</text>
        <text x="360" y="140">나래</text>
        <text x="90"  y="310">다온</text>
        <text x="420" y="310">라온</text>
        <text x="255" y="428">마루</text>
      </g>

      <!-- 고립 노드 강조 -->
      <circle cx="255" cy="380" r="33" fill="none" stroke="#E8705A" stroke-width="2.4" stroke-dasharray="5 5"/>
      <text x="332" y="386" font-size="16" fill="#E8705A" font-family="'Noto Sans KR',sans-serif">연결 1개</text>
    </svg>

    <!-- 오른쪽: 인접행렬 -->
    <div>
      <svg width="470" height="330" viewBox="0 0 470 330">
        <text x="8" y="40" font-size="34" font-weight="700" fill="#3E9C93" font-family="'Noto Sans KR',sans-serif">A =</text>
        <!-- 대괄호 -->
        <path d="M 100 22 L 88 22 L 88 300 L 100 300" stroke="#33415C" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <path d="M 372 22 L 384 22 L 384 300 L 372 300" stroke="#33415C" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <g font-size="26" fill="#33415C" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">
          <text x="128" y="66">0</text><text x="184" y="66">1</text><text x="240" y="66">1</text><text x="296" y="66">0</text><text x="352" y="66">0</text>
          <text x="128" y="122">1</text><text x="184" y="122">0</text><text x="240" y="122">1</text><text x="296" y="122">1</text><text x="352" y="122">0</text>
          <text x="128" y="178">1</text><text x="184" y="178">1</text><text x="240" y="178">0</text><text x="296" y="178">1</text><text x="352" y="178">1</text>
          <text x="128" y="234">0</text><text x="184" y="234">1</text><text x="240" y="234">1</text><text x="296" y="234">0</text><text x="352" y="234">0</text>
        </g>
        <g font-size="26" font-family="'Noto Sans KR',sans-serif" text-anchor="middle" fill="#E8705A">
          <text x="128" y="290">0</text><text x="184" y="290">0</text><text x="240" y="290">1</text><text x="296" y="290">0</text><text x="352" y="290">0</text>
        </g>
        <!-- 마지막 행 하이라이트 -->
        <rect x="104" y="262" width="272" height="38" fill="#E8705A" opacity="0.09" rx="6"/>
      </svg>
      <div class="caption">마루의 행: 1이 하나뿐 → 소외된 친구</div>
    </div>
  </div>

  <!-- 우측 여백 동물 캐릭터 (거북이, 말풍선) -->
  <svg width="170" height="130" viewBox="0 0 170 130" style="position:absolute;right:78px;bottom:56px;">
    <rect x="42" y="4" width="124" height="42" rx="14" fill="#FDFDFB" stroke="#3E9C93" stroke-width="2"/>
    <path d="M 56 46 L 50 60 L 68 46 Z" fill="#FDFDFB" stroke="#3E9C93" stroke-width="2" stroke-linejoin="round"/>
    <text x="104" y="31" font-size="16" fill="#3E9C93" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">행 합 = 친구 수!</text>
    <ellipse cx="42" cy="98" rx="34" ry="24" fill="#3E9C93"/>
    <path d="M 8 98 a 34 24 0 0 1 68 0" fill="#E4B04A"/>
    <circle cx="86" cy="90" r="14" fill="#B9C6C4"/>
    <circle cx="91" cy="87" r="2.6" fill="#33415C"/>
    <ellipse cx="16" cy="120" rx="8" ry="5" fill="#B9C6C4"/>
    <ellipse cx="60" cy="120" rx="8" ry="5" fill="#B9C6C4"/>
  </svg>

  <!-- 페이지 번호 -->
  <div style="position:absolute;left:90px;bottom:42px;font-size:16px;color:#33415C;opacity:.4;letter-spacing:.2em;">04</div>
</div>
</body>
</html>
