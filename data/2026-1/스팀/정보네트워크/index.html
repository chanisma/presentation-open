<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if(!location.pathname.endsWith('/')&&!location.pathname.endsWith('.html')){var b=document.createElement('base');b.href=location.pathname+'/';document.head.appendChild(b);}</script>
<title>디지털 네트워크와 행렬 [정보편] — 코드로 관계를 읽다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FDFDFB;
    --ink:#33415C;
    --ink-soft:#7B8698;
    --rule:#D5DBE1;
    --wash:rgba(62,156,147,0.08);
    --critter-teal:#3E9C93;
    --critter-coral:#E8705A;
    --critter-mustard:#E4B04A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'EB Garamond','Noto Sans KR',Georgia,serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  .progress{
    position:fixed;top:0;left:0;height:2px;width:0%;
    background:var(--critter-teal);transition:width .35s ease;z-index:20;
  }

  .stage{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    padding:32px 56px 64px;
  }

  .slide-frame{
    position:relative;
    width:min(100%, calc((100vh - 96px) * 16 / 9));
    aspect-ratio:16/9;
    background:var(--paper);
    border:1px solid var(--rule);
    box-shadow:
      0 0 0 6px var(--paper),
      0 0 0 7px rgba(213,219,225,0.55);
  }

  .slide{
    position:absolute;inset:0;
    opacity:0;transition:opacity .45s ease;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .slide.active{opacity:1;pointer-events:auto;}
  .slide img{
    width:100%;height:100%;
    object-fit:contain;
    display:block;
    user-select:none;-webkit-user-drag:none;
  }

  .ribbon{
    position:fixed;left:0;right:0;bottom:0;
    height:48px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 28px;
    background:var(--paper);
    border-top:1px solid var(--rule);
    z-index:15;
    font-family:'EB Garamond',Georgia,serif;
  }
  .ribbon .meta{font-style:italic;color:var(--ink-soft);font-size:13px;letter-spacing:0.02em;}
  .ribbon .counter{font-variant-numeric:tabular-nums;letter-spacing:0.18em;font-size:13px;color:var(--ink);}
  .ribbon .center{
    position:absolute;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:18px;
    font-size:12px;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:0.28em;
    font-family:'EB Garamond',Georgia,serif;
  }
  .ribbon .em-rule{display:inline-block;width:24px;height:1px;background:var(--ink-soft);vertical-align:middle;}

  .ribbon .marker-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--critter-teal);vertical-align:middle;margin:0 2px;}
  .ribbon .marker-dot.coral{background:var(--critter-coral);}
  .ribbon .marker-dot.mustard{background:var(--critter-mustard);}

  .nav-btn{
    position:fixed;top:50%;transform:translateY(-50%);
    width:44px;height:44px;
    background:transparent;border:1px solid var(--rule);
    color:var(--ink);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .2s ease, transform .15s ease;
    z-index:18;
  }
  .nav-btn:hover{background:var(--wash);}
  .nav-btn:active{transform:translateY(-50%) scale(0.96);}
  .nav-btn.prev{left:14px;}
  .nav-btn.next{right:14px;}
  .nav-btn svg{width:18px;height:18px;}
  .nav-btn:disabled{opacity:0.25;cursor:default;}

  .index-toggle{
    position:fixed;top:14px;right:14px;
    background:transparent;border:1px solid var(--rule);color:var(--ink);
    padding:6px 12px;font:italic 12px/1 'EB Garamond',Georgia,serif;
    letter-spacing:0.06em;cursor:pointer;z-index:18;
  }
  .index-toggle:hover{background:var(--wash);}
  .index-panel{
    position:fixed;inset:0;
    background:rgba(253,253,251,0.96);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    z-index:25;padding:48px;
  }
  .index-panel.open{display:flex;}
  .index-panel h2{font:italic 26px 'EB Garamond',serif;margin-bottom:8px;color:var(--critter-teal);letter-spacing:0.02em;}
  .index-panel .sub{font:13px 'EB Garamond',serif;letter-spacing:0.32em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:24px;}
  .index-grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));gap:14px;
    width:min(1100px,90%);max-height:70vh;overflow-y:auto;padding:8px 4px;
  }
  .thumb{position:relative;border:1px solid var(--rule);aspect-ratio:16/9;background:var(--paper);cursor:pointer;overflow:hidden;transition:transform .15s ease;}
  .thumb:hover{transform:translateY(-2px);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .num{position:absolute;bottom:4px;right:6px;font:11px 'EB Garamond',serif;font-variant-numeric:tabular-nums;color:var(--ink-soft);background:var(--paper);padding:1px 5px;border:1px solid var(--rule);}
  .index-close{position:absolute;top:24px;right:24px;background:transparent;border:none;cursor:pointer;font:italic 14px 'EB Garamond',serif;color:var(--ink);letter-spacing:0.06em;}

  .corner-note{position:fixed;top:16px;left:24px;font:italic 12px 'EB Garamond',serif;color:var(--ink-soft);letter-spacing:0.04em;z-index:18;}
  .corner-note .roman{letter-spacing:0.16em;}

  /* 상황별 활동지 열기 버튼 — 현재 슬라이드 구간에 맞는 활동으로 연결 */
  .act-links{
    position:fixed;right:20px;bottom:62px;z-index:19;
    display:flex;flex-direction:column;align-items:flex-end;gap:8px;
  }
  .act-link{
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 16px;border-radius:22px;
    background:var(--critter-teal);color:#fff;text-decoration:none;
    font-family:'Noto Sans KR',sans-serif;font-size:13.5px;font-weight:500;
    box-shadow:0 4px 14px rgba(62,156,147,0.32);
    transition:transform .15s ease, box-shadow .15s ease, opacity .3s ease;
    animation:actin .3s ease;
  }
  /* 두 번째(진행) 버튼은 코랄 톤으로 구분 */
  .act-link.alt{background:var(--critter-coral);box-shadow:0 4px 14px rgba(232,112,90,0.30);}
  @keyframes actin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .act-link:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(62,156,147,0.42);}
  .act-link.alt:hover{box-shadow:0 6px 18px rgba(232,112,90,0.42);}
  .act-link svg{width:15px;height:15px;stroke:#fff;}
  .act-link .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.85);}

  @media print{
    body{background:white;}
    .ribbon,.nav-btn,.index-toggle,.corner-note,.progress,.act-link{display:none !important;}
    .stage{padding:0;}
    .slide-frame{border:none;box-shadow:none;width:100%;height:100vh;}
  }

  @media (max-width: 720px){
    .stage{padding:14px 14px 56px;}
    .nav-btn{width:36px;height:36px;}
    .ribbon{height:42px;padding:0 14px;font-size:12px;}
    .ribbon .center{display:none;}
    .corner-note{display:none;}
    .act-link{right:12px;bottom:52px;padding:8px 13px;font-size:12.5px;}
  }
</style>
</head>
<body>

<div class="progress" id="progress"></div>

<aside class="corner-note">
  <span class="roman">— xxviii —</span> &nbsp; 디지털 네트워크와 행렬 · 정보 편 (파이썬 × 네트워크)
</aside>

<button class="index-toggle" id="indexToggle">— index —</button>

<div class="stage">
  <div class="slide-frame" id="frame" aria-roledescription="presentation"></div>
</div>

<button class="nav-btn prev" id="prev" aria-label="이전 슬라이드">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
</button>
<button class="nav-btn next" id="next" aria-label="다음 슬라이드">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
</button>

<div class="act-links" id="actLinks"></div>

<footer class="ribbon">
  <div class="meta"><em>Code &amp; Networks</em> — a critter primer for high-school beginners</div>
  <div class="center">
    <span class="em-rule"></span>
    <span>Critter · Session</span>
    <span class="marker-dot"></span><span class="marker-dot coral"></span><span class="marker-dot mustard"></span>
    <span class="em-rule"></span>
  </div>
  <div class="counter" id="counter">01 / 26</div>
</footer>

<div class="index-panel" id="indexPanel" role="dialog" aria-modal="true" aria-label="슬라이드 목차">
  <button class="index-close" id="indexClose">— close —</button>
  <h2>Critter Plates</h2>
  <div class="sub">디지털 네트워크와 행렬 [정보편] · 28 slides</div>
  <div class="index-grid" id="indexGrid"></div>
</div>

<script>
  const TOTAL = 28;
  const frame = document.getElementById('frame');
  const counter = document.getElementById('counter');
  const progress = document.getElementById('progress');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const indexToggle = document.getElementById('indexToggle');
  const indexPanel = document.getElementById('indexPanel');
  const indexClose = document.getElementById('indexClose');
  const indexGrid = document.getElementById('indexGrid');

  let current = 0;
  function pad(n){return String(n).padStart(2,'0');}

  // 슬라이드 구간별로 연결되는 활동지 (슬라이드 번호는 1-based)
  // 프로젝트 섹션(21~26)은 설계(활동4)·진행(활동5) 두 활동을 함께 연다.
  const ACT_MAP = [
    { from: 3,  to: 9,  file: '활동1.html', label: '활동 1 · 파이썬 실습' },
    { from: 10, to: 17, file: '활동2.html', label: '활동 2 · 중심성 비교' },
    { from: 18, to: 20, file: '활동3.html', label: '활동 3 · AI 프롬프트' },
    { from: 21, to: 26, file: '활동4.html', label: '활동 4 · 프로젝트 설계' },
    { from: 21, to: 26, file: '활동5.html', label: '활동 5 · 프로젝트 진행', alt: true },
    { from: 27, to: 28, file: '활동6.html', label: '활동 6 · 심화 결과물' }
  ];
  const ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>';
  const actLinks = document.getElementById('actLinks');
  function updateActLink(slideNo){
    const matches = ACT_MAP.filter(a => slideNo >= a.from && slideNo <= a.to);
    // 동일 구간이면 다시 그리지 않음(애니메이션 재생 방지)
    const sig = matches.map(m => m.file).join('|');
    if (actLinks.dataset.sig === sig) return;
    actLinks.dataset.sig = sig;
    actLinks.textContent = '';
    matches.forEach(m => {
      const a = document.createElement('a');
      a.className = 'act-link' + (m.alt ? ' alt' : '');
      a.href = m.file; a.target = '_blank'; a.rel = 'noopener';
      const dot = document.createElement('span'); dot.className = 'dot';
      const lab = document.createElement('span'); lab.textContent = '📝 ' + m.label + ' 열기';
      a.appendChild(dot); a.appendChild(lab);
      a.insertAdjacentHTML('beforeend', ICON_SVG);
      actLinks.appendChild(a);
    });
  }

  for (let i = 1; i <= TOTAL; i++) {
    const num = pad(i);
    const div = document.createElement('div');
    div.className = 'slide' + (i === 1 ? ' active' : '');
    div.dataset.idx = i - 1;
    const img = document.createElement('img');
    img.src = 'images/slide-' + num + '.png';
    img.alt = '슬라이드 ' + i;
    img.loading = i <= 2 ? 'eager' : 'lazy';
    div.appendChild(img);
    frame.appendChild(div);
  }

  for (let i = 1; i <= TOTAL; i++) {
    const num = pad(i);
    const t = document.createElement('div');
    t.className = 'thumb';
    t.dataset.idx = i - 1;
    const tImg = document.createElement('img');
    tImg.src = 'images/slide-' + num + '.png';
    tImg.alt = '슬라이드 ' + i;
    tImg.loading = 'lazy';
    const n = document.createElement('span');
    n.className = 'num';
    n.textContent = num;
    t.appendChild(tImg);
    t.appendChild(n);
    indexGrid.appendChild(t);
  }

  const slides = Array.from(frame.querySelectorAll('.slide'));

  function show(idx){
    if (idx < 0) idx = 0;
    if (idx > TOTAL - 1) idx = TOTAL - 1;
    slides[current].classList.remove('active');
    slides[idx].classList.add('active');
    current = idx;
    counter.textContent = pad(current+1) + ' / ' + pad(TOTAL);
    progress.style.width = ((current+1)/TOTAL*100) + '%';
    prevBtn.disabled = (current === 0);
    nextBtn.disabled = (current === TOTAL - 1);
    updateActLink(current + 1);
  }

  function next(){ show(current + 1); }
  function prev(){ show(current - 1); }

  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);

  document.addEventListener('keydown', (e) => {
    if (indexPanel.classList.contains('open')) {
      if (e.key === 'Escape') closeIndex();
      return;
    }
    if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft','PageUp','Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(TOTAL - 1);
    else if (e.key === 'Escape') closeIndex();
    else if (e.key === 'g' || e.key === 'G') openIndex();
  });

  let wheelLock = false;
  window.addEventListener('wheel', (e) => {
    if (wheelLock) return;
    if (Math.abs(e.deltaY) < 8) return;
    wheelLock = true;
    setTimeout(() => wheelLock = false, 420);
    if (e.deltaY > 0) next(); else prev();
  }, { passive: true });

  let tx = null, ty = null;
  window.addEventListener('touchstart', e => { const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
  window.addEventListener('touchend', e => {
    if (tx === null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { if (dx < 0) next(); else prev(); }
    tx = ty = null;
  }, { passive: true });

  frame.addEventListener('click', (e) => {
    const rect = frame.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x < rect.width / 3) prev(); else next();
  });

  function openIndex(){ indexPanel.classList.add('open'); }
  function closeIndex(){ indexPanel.classList.remove('open'); }
  indexToggle.addEventListener('click', openIndex);
  indexClose.addEventListener('click', closeIndex);
  indexGrid.addEventListener('click', (e) => {
    const t = e.target.closest('.thumb');
    if (!t) return;
    show(parseInt(t.dataset.idx, 10));
    closeIndex();
  });

  show(0);
</script>
  <script type="module" src="../../../../live/runtime/chrome.js?v=2"></script>
</body>
</html>
