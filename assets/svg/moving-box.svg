<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 230" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- 의도: 비스듬히 위에서 본 테이프 붙인 이사 상자. 앞면에 "이쪽이 위" 화살표 두 개.
       배포를 "내 방의 상자를 빌린 건물로 옮기는 이사"로 보여 주는 장면의 소품
       (바이브코딩 「웹의 구조와 설계도」 8장). 앞면 가운데에 덱이 파일 이름 라벨을 얹는다.
       어두운 청사진 배경 위 — 면을 밝게, 잉크는 짙은 남색.
       팔레트: ink #0b1a30 · top #e8bf86 · front #d29c5c · side #a8733a · tape #f3e6c4 · mark #0b1a30
       앵커: 앞면 라벨 자리 x 30~170, y 120~150 (중심 100,136) · 바닥 y≈216 -->

  <!-- 바닥 그림자 -->
  <path d="M22 220 L236 220" stroke="#0b1a30" stroke-width="10" opacity=".08" />

  <!-- 옆면 -->
  <path d="M184 72 L240 44 L240 176 L184 214 Z" fill="#a8733a" stroke="#0b1a30" stroke-width="2.4" />
  <!-- 앞면 -->
  <path d="M16 72 L184 72 L184 214 L16 214 Z" fill="#d29c5c" stroke="#0b1a30" stroke-width="2.4" />
  <!-- 윗면 (날개 두 장이 닫힌 면) -->
  <path d="M16 72 L74 44 L240 44 L184 72 Z" fill="#e8bf86" stroke="#0b1a30" stroke-width="2.4" />
  <!-- 날개 이음선 -->
  <path d="M45 58 L212 58" stroke="#0b1a30" stroke-width="1.6" opacity=".55" />
  <!-- 윗면 테이프 -->
  <path d="M38 61 L56 52 L222 52 L204 61 Z" fill="#f3e6c4" stroke="#0b1a30" stroke-width="1.6" />
  <path d="M70 56 L190 56" stroke="#ffffff" stroke-width="2" opacity=".35" />
  <!-- 앞면 테이프 (위에서 내려옴) -->
  <path d="M86 72 L114 72 L114 104 L86 104 Z" fill="#f3e6c4" stroke="#0b1a30" stroke-width="1.6" />
  <path d="M86 104 L91 100 L96 104 L101 100 L106 104 L111 100 L114 104" stroke="#0b1a30" stroke-width="1.3" />

  <!-- 골판지 결 -->
  <path d="M30 186 L70 186 M130 194 L170 194" stroke="#0b1a30" stroke-width="1.2" opacity=".2" />
  <path d="M196 120 L228 104 M196 168 L228 150" stroke="#0b1a30" stroke-width="1.2" opacity=".2" />
  <path d="M26 82 L70 82" stroke="#ffffff" stroke-width="3" opacity=".22" />

  <!-- 라벨 자리 (빈 종이 — 글자는 덱이 얹는다) -->
  <path d="M30 120 L170 120 L170 152 L30 152 Z" fill="#f6efe0" stroke="#0b1a30" stroke-width="1.8" />

  <!-- "이쪽이 위" 화살표 두 개 -->
  <path d="M40 200 L40 176 M32 184 L40 174 L48 184" stroke="#0b1a30" stroke-width="2.4" />
  <path d="M60 200 L60 176 M52 184 L60 174 L68 184" stroke="#0b1a30" stroke-width="2.4" />
  <path d="M30 204 L70 204" stroke="#0b1a30" stroke-width="2.2" />
</svg>
