<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 230" fill="none">
  <!-- 요리사 컴퓨터 — 잉크 스케치. 의도: "코딩이 아니라 주문" 비유의 주인공.
       요리사 모자를 쓴 웃는 모니터가 김 오르는 파스타 접시를 내민다.
       (바이브코딩 화이트보드 일러스트의 모티프를 덱 고유 잉크 스타일로
       재해석 — 이미지 재활용 대신 스타일 일관 저작.) 앰버 잉크. -->
  <g stroke="#ffd9a8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 요리사 모자: 모니터 상단에 밀착한 구름형 크라운 + 밴드 -->
    <path d="M82 74 C74 56 90 42 106 48 C110 32 136 30 144 44 C160 36 176 50 168 66 C174 70 174 78 168 80 L88 82 C80 82 78 78 82 74" stroke-width="3.2"/>
    <path d="M92 60 C94 54 100 52 104 54" stroke-width="1.7" opacity="0.45"/>
    <!-- 모니터: 둥근 사각 (열린 선) — 모자 밴드와 맞닿음 -->
    <path d="M70 92 C68 86 72 82 78 82 L180 80 C188 80 192 85 192 92 L193 148 C193 156 188 160 181 160 L80 162 C72 162 68 157 68 150 Z" stroke-width="3.4"/>
    <path d="M76 90 C76 87 79 85 83 85" stroke-width="1.7" opacity="0.45"/>
    <!-- 웃는 눈·입 -->
    <path d="M102 112 C105 106 112 106 115 111" stroke-width="3"/>
    <path d="M144 111 C147 105 154 105 157 110" stroke-width="3"/>
    <path d="M116 130 C124 138 138 138 146 129" stroke-width="2.8"/>
    <!-- 스탠드 + 발 -->
    <path d="M124 162 L122 182 M138 162 L140 182" stroke-width="3"/>
    <path d="M108 186 L156 185" stroke-width="3"/>
    <!-- 내미는 팔 -->
    <path d="M192 120 C204 118 212 124 216 132" stroke-width="3"/>
    <!-- 접시: 크고 명확하게 -->
    <path d="M196 158 C210 165 236 165 248 157" stroke-width="3.2"/>
    <path d="M202 158 C212 162 232 162 242 157" stroke-width="1.8" opacity="0.5"/>
    <!-- 파스타: 접시 위 곱슬 면 세 덩이 -->
    <path d="M206 150 C208 142 216 142 218 148 C220 140 228 140 230 147 C232 141 240 142 240 149" stroke-width="2.6"/>
    <path d="M212 155 C218 152 228 152 236 154" stroke-width="2" opacity="0.6"/>
    <!-- 김 두 줄 -->
    <path d="M216 132 C212 124 218 116 226 118" stroke-width="2.2" opacity="0.65"/>
    <path d="M230 126 C226 118 232 110 240 113" stroke-width="1.9" opacity="0.45"/>
    <!-- 왼쪽: 도착한 주문서 쪽지 -->
    <path d="M34 96 L58 92 L60 118 L38 122 Z" stroke-width="2.4"/>
    <path d="M40 101 L52 99 M41 108 L53 106 M42 115 L50 113" stroke-width="1.8" opacity="0.6"/>
    <path d="M60 104 C66 104 70 106 72 110" stroke-width="2" opacity="0.7"/>
  </g>
</svg>
