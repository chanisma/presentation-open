<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- 의도: 옆에서 본 도자기 드립 깔때기(드리퍼)가 유리 서버 위에 얹힌 모습. 아이디어 조각이 깔때기에 쌓이고
       아래 서버에 한 문장이 떨어져 모이는 장면(쇼츠 대본 쓰기 S5 — 핵심 메시지). 어두운 배경에서도 면이 밝아 실루엣이 산다.
       서버 안쪽은 비워 두었다 — 덱이 글자를 채운다. 텍스트 없음.
       팔레트: ink #10131d · ceramic #f1ece2 · ceramicShade #d6cdbd · paper #fbf7ec · glass #cfe3ee · glassShade #a9c6d6 · handle #f1ece2
       앵커: 깔때기 입구 y≈46 (x 34~266) · 추출 구멍 (150, 176) · 서버 안쪽 빈 칸 x 62~238, y 214~326 -->
  <path d="M40 350 C110 356 190 356 260 350" stroke="#10131d" stroke-width="8" opacity=".12" />
  <!-- 유리 서버 -->
  <path d="M58 196 L242 196 C246 196 248 199 248 203 L248 330 C248 340 240 346 230 346 L70 346 C60 346 52 340 52 330 L52 203 C52 199 54 196 58 196 Z"
        fill="#cfe3ee" fill-opacity=".38" stroke="#10131d" stroke-width="2.4" />
  <path d="M248 226 C276 226 284 246 284 266 C284 290 270 304 248 304" stroke="#10131d" stroke-width="7" />
  <path d="M248 226 C276 226 284 246 284 266 C284 290 270 304 248 304" stroke="#cfe3ee" stroke-width="3.4" />
  <path d="M66 214 L66 322" stroke="#ffffff" stroke-width="4" opacity=".5" />
  <path d="M78 214 L78 260" stroke="#ffffff" stroke-width="2.2" opacity=".35" />
  <!-- 서버 뚜껑 링 -->
  <path d="M60 196 L240 196 L236 184 L64 184 Z" fill="#a9c6d6" stroke="#10131d" stroke-width="2.2" />
  <!-- 깔때기 받침판 -->
  <path d="M86 168 L214 168 C220 168 224 172 224 177 L224 180 C224 184 220 186 216 186 L84 186 C80 186 76 184 76 180 L76 177 C76 172 80 168 86 168 Z"
        fill="#d6cdbd" stroke="#10131d" stroke-width="2.2" />
  <!-- 깔때기 몸 -->
  <path d="M34 46 L266 46 L196 168 L104 168 Z" fill="#f1ece2" stroke="#10131d" stroke-width="2.4" />
  <path d="M232 46 L266 46 L196 168 L180 168 Z" fill="#d6cdbd" />
  <path d="M34 46 L266 46 L196 168 L104 168 Z" stroke="#10131d" stroke-width="2.4" />
  <!-- 필터 종이 가장자리 -->
  <path d="M44 46 L60 32 L240 32 L256 46 Z" fill="#fbf7ec" stroke="#10131d" stroke-width="2" />
  <g stroke="#10131d" stroke-width="1.2" opacity=".35"><path d="M90 32 L94 46" /><path d="M150 32 L150 46" /><path d="M210 32 L206 46" /></g>
  <!-- 결 -->
  <g stroke="#10131d" stroke-width="1.4" opacity=".28"><path d="M96 70 L128 150" /><path d="M150 70 L150 150" /><path d="M204 70 L172 150" /></g>
  <path d="M60 58 L110 58" stroke="#ffffff" stroke-width="3" opacity=".6" />
  <!-- 손잡이 -->
  <path d="M262 62 C292 66 292 116 240 120" stroke="#10131d" stroke-width="9" />
  <path d="M262 62 C292 66 292 116 240 120" stroke="#f1ece2" stroke-width="5" />
  <!-- 추출 구멍 -->
  <ellipse cx="150" cy="178" rx="8" ry="3" fill="#10131d" />
</svg>
