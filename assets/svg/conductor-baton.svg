<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- 의도: 옆에서 본 오케스트라 지휘봉. 나무 손잡이(왼쪽) + 금속 고리 + 가늘어지는 흰 봉(오른쪽 끝이 지휘 끝).
       「여러 업무를 나누어 맡기고 검토하기」를 총보·지휘로 보여 주는 장면의 소품 (ai-era-teacher 12쪽).
       덱에서 비스듬히 회전해 놓는다. 밝은 배경용 잉크. 텍스트 없음.
       팔레트: ink #1b2133 · grip #b9814c · gripDark #9a6534 · gripTop #d6a571 · ring #c9a04a · shaft #fbf8ef · shaftShade #e4dcc6
       앵커: 지휘 끝 viewBox (506, 60) · 손잡이 중심 (70, 60) -->

  <!-- 옅은 그림자 -->
  <path d="M30 88 C60 98 110 96 140 84 L506 70 L140 92 C100 106 50 104 30 88 Z" fill="#1b2133" opacity=".07" />

  <!-- 흰 봉 (손잡이 쪽이 굵고 끝이 가늘다) -->
  <path d="M146 51 L504 57.5 C508 58 508 62 504 62.5 L146 69 Z" fill="#fbf8ef" stroke="#1b2133" stroke-width="2.2" />
  <path d="M150 64 L500 61" stroke="#e4dcc6" stroke-width="3.2" />
  <path d="M170 54.5 L330 57.2" stroke="#ffffff" stroke-width="2.2" opacity=".9" />

  <!-- 금속 고리 -->
  <path d="M132 46 L148 47 C151 47 152 50 152 53 L152 67 C152 70 151 73 148 73 L132 74 Z" fill="#c9a04a" stroke="#1b2133" stroke-width="2.2" />
  <path d="M137 48 L137 72" stroke="#1b2133" stroke-width="1.4" opacity=".35" />
  <path d="M141 51 L147 51" stroke="#ffffff" stroke-width="2" opacity=".45" />

  <!-- 나무 손잡이: 물방울형 -->
  <path d="M132 44 C112 40 96 30 70 30 C38 30 18 44 18 60 C18 76 38 90 70 90 C96 90 112 80 132 76 Z"
        fill="#b9814c" stroke="#1b2133" stroke-width="2.4" />
  <!-- 윗면 밝은 면 -->
  <path d="M28 54 C34 42 52 36 72 36 C94 36 110 44 128 48 L128 52 C108 50 92 46 70 46 C50 46 36 50 28 54 Z" fill="#d6a571" />
  <!-- 아랫면 어두운 면 -->
  <path d="M26 70 C36 80 52 84 70 84 C94 84 110 76 128 72 L128 75 C110 80 94 88 70 88 C48 88 32 80 26 70 Z" fill="#9a6534" />
  <!-- 나뭇결 -->
  <g stroke="#1b2133" stroke-width="1.3" opacity=".3">
    <path d="M44 58 C64 54 92 56 118 60" />
    <path d="M40 66 C66 68 94 66 120 64" />
    <path d="M58 76 C76 78 96 76 112 72" />
  </g>
  <!-- 반사 -->
  <path d="M40 44 C50 38 62 36 76 36" stroke="#ffffff" stroke-width="3" opacity=".3" />
</svg>
