  <path d="M240 64 C232 59 226 57 222 56 L222 256 C229 258 235 263 240 270 Z" fill="#22304a" opacity=".07"/>
  <path d="M240 64 C248 59 254 57 258 56 L258 256 C251 258 245 263 240 270 Z" fill="#22304a" opacity=".045"/>
