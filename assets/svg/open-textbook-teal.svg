  <path d="M38 262 C120 252 200 254 240 270 C280 254 360 252 442 262 L442 276 C360 266 280 268 240 284 C200 268 120 266 38 276 Z" fill="#e8dcc4" stroke="#22304a" stroke-width="1.8"/>
  <path d="M42 269 C120 260 200 262 240 277 M240 277 C280 262 360 260 438 269" stroke="#22304a" stroke-width="1.2" opacity=".4"/>
  <!-- 왼쪽·오른쪽 페이지 -->
  <path d="M240 64 C200 46 120 42 38 54 L38 262 C120 252 200 254 240 270 Z" fill="#fbf7ee" stroke="#22304a" stroke-width="2.2"/>
  <path d="M240 64 C280 46 360 42 442 54 L442 262 C360 252 280 254 240 270 Z" fill="#fbf7ee" stroke="#22304a" stroke-width="2.2"/>
