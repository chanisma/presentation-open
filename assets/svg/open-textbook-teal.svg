  <path d="M60 60 C110 54 170 55 212 64" stroke="#22304a" stroke-width="1.2" opacity=".18"/>
  <path d="M268 64 C310 55 370 54 420 60" stroke="#22304a" stroke-width="1.2" opacity=".18"/>
