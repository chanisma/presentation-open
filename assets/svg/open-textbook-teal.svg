<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- 의도: 정면에서 약간 내려다본 펼친 교과서. 겉모양은 같고 표지 색만 다른 두 권(open-textbook-brown / open-textbook-teal)으로 쓴다
       (image-classifier-project S4 「같은 학생, 다른 교과서」 — 교과서 A·B의 사진이 모델 상자로 빨려 들어간다).
       양쪽 페이지는 비워 두었다 — 덱이 사진 썸네일을 얹는 빈 면. 텍스트 없음. 그라데이션 없음.
       팔레트: ink #22304a · cover #3f7f78 (청록) · coverDark #2b5c57 · page #fbf7ee · pageEdge #e8dcc4 · ribbon #d98e04
       앵커: 왼쪽 빈 면 x 62~222, y 80~248 · 오른쪽 빈 면 x 258~418, y 80~248 (페이지 곡선 안쪽 안전 영역) · 책등 x=240 -->
  <ellipse cx="240" cy="314" rx="220" ry="13" fill="#22304a" opacity=".07"/>
  <!-- 표지(뒤판) + 두께 -->
  <path d="M16 60 C108 46 196 48 240 60 C284 48 372 46 464 60 L464 288 C372 278 284 280 240 296 C196 280 108 278 16 288 Z" fill="#3f7f78" stroke="#22304a" stroke-width="2.4"/>
